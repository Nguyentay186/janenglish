<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1426);--ink:light-dark(#0d1f3c,#eef2f8);--muted:light-dark(#5a6680,#a3aec4);--card:light-dark(#f4f6fa,#142240);--line:light-dark(#dde3ec,#26355a);--band:light-dark(#0d1f3c,#0b1830);--band2:light-dark(#0a1830,#08122a);--shu:#e01b24;--shu-ink:light-dark(#c4141c,#ff6b70);--ok:light-dark(#1f7a45,#6fcf8f);--soft:light-dark(#fdecec,#3a1a22)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto}
.band{padding-block:clamp(24px,4vw,52px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
header{position:sticky;top:0;z-index:5;background:#fff;color:#0d1f3c;border-bottom:3px solid var(--shu);box-shadow:0 2px 10px rgba(13,31,60,.08)}
.hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px max(5vw,16px)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:22px;letter-spacing:-.02em;color:#0d1f3c}
.logo i{width:34px;height:34px;border-radius:50%;background:var(--shu);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800}
.logo span b{color:var(--shu)}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;text-decoration:none;padding:9px 13px;border-radius:999px;font-weight:600;font-size:15px;color:#0d1f3c}
nav a:hover{background:#fdecec}
nav a.on{background:var(--shu);color:#fff}
.hero{background:var(--band);color:#fff}
.hgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:stretch}
h1{font-size:clamp(32px,5vw,50px);line-height:1.05;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
h2{font-size:clamp(24px,3.2vw,34px);line-height:1.12;letter-spacing:-.02em;margin:0 0 8px}
h3{font-size:19px;margin:0 0 6px;line-height:1.3}
.lead{font-size:17px;color:#d3dcec;max-width:34em;margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 22px}
.stat{border-top:2px solid rgba(255,255,255,.35);padding-top:8px}
.stat b{display:block;font-size:clamp(24px,3.2vw,34px);line-height:1.1}
.stat span{font-size:14px;color:#c6d1e4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 18px;border-radius:12px;border:0;background:var(--shu);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:15px}
.hcard{background:var(--band2);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hcard h3{font-size:22px}
.cd{font-size:clamp(44px,7vw,72px);font-weight:800;line-height:1;color:#fff}
.cd small{font-size:18px;font-weight:600;color:#c6d1e4;margin-left:6px}
.meter{height:10px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.meter i{display:block;height:100%;background:var(--shu);border-radius:9px;transition:width .6s}
.pm{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.pm i{display:block;height:100%;background:var(--ok)}
.hcard input{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.path{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none}
.path:hover{border-color:var(--shu)}
.glyph{font-size:34px;font-weight:800;line-height:1;color:var(--shu-ink)}
.path p{margin:0;color:var(--muted)}
.go{margin-top:auto;font-weight:700;color:var(--shu-ink)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.tab{min-height:42px;padding:7px 16px;border-radius:999px;border:2px solid var(--line);background:transparent;font-weight:700}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.chip.on{background:var(--band);color:#fff;border-color:var(--band)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;text-decoration:none}
.item:hover{border-color:var(--shu)}
.item h3{font-size:17px}
.badge{flex:none;font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--band);color:#fff;white-space:nowrap}
.badge.r{background:var(--shu)}
.done{color:var(--ok);font-weight:700;font-size:14px}
.gh{margin:22px 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px)}
.ex{border-left:3px solid var(--shu);padding:4px 0 4px 12px;margin:10px 0}
.ex .en{font-size:18px}
.ex .vi{color:var(--muted);font-size:15px}
.formula{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;overflow-wrap:anywhere;font-weight:600}
.tip{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}
.qtext{font-size:20px;line-height:1.45;margin:4px 0 14px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:46px;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:17px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.opt.wrong{border-color:var(--shu);background:color-mix(in srgb,var(--shu) 12%,var(--bg))}
.opt b{display:inline-block;width:26px}
.why{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.qbar{display:flex;gap:4px;margin:0 0 14px}
.qbar i{flex:1;height:6px;border-radius:4px;background:var(--line)}
.qbar i.r{background:var(--ok)}.qbar i.w{background:var(--shu)}.qbar i.c{background:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cardbox{max-width:580px;margin:0 auto}
.flash{width:100%;min-height:320px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}
.flash .big{font-size:clamp(38px,8vw,58px);line-height:1.1;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.flash .ipa{font-size:21px;color:var(--shu-ink);font-family:"Segoe UI","Noto Sans",system-ui,sans-serif}
.flash .pos{font-size:14px;color:var(--muted);font-style:italic}
.flash .mean{font-size:23px;font-weight:700}
.flash .exe{font-size:18px;margin-top:8px}
.flash .exv{color:var(--muted);font-size:15px}
.icon{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:inline-grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px}
.icon.sm{width:36px;height:36px}.icon.sm svg{width:16px;height:16px}
.wl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wl .w{font-weight:700;font-size:17px}
.wl .ipa{color:var(--shu-ink);font-size:15px;font-family:"Segoe UI","Noto Sans",system-ui,sans-serif}
.wl .v{color:var(--muted);font-size:15px}
.wl .k{font-size:12px;font-weight:800;color:var(--ok)}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 8px;border-top:1px solid var(--line)}
.spk{font-size:13px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.spk.b{background:var(--band);color:#fff;border-color:var(--band)}
.dl .en{font-size:18px;line-height:1.5}
.dl .vi{color:var(--muted);font-size:15px}
.hide{color:var(--muted);font-style:italic}
.dl.now{background:color-mix(in srgb,var(--shu) 10%,transparent);border-radius:10px}
.mail{white-space:pre-wrap;font-size:16px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-wrap:anywhere}
.passage{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:16px;line-height:1.6}
.blank{display:inline-block;min-width:2.4em;padding:0 6px;border-bottom:2px solid var(--shu);font-weight:800;color:var(--shu-ink);text-align:center}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.ctl label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{display:flex;width:max-content;align-items:center;min-height:42px;text-decoration:none;font-weight:600;color:var(--muted)}
.score{font-size:46px;font-weight:800;line-height:1}
@media(max-width:860px){.hgrid,.lesson{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.hd{gap:6px}nav{margin-left:0;width:100%}nav a{padding:8px 11px}.dl{grid-template-columns:minmax(0,1fr) auto}.dl .spk{grid-column:1/-1;justify-self:start}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

const TP=/*TP*/[{"id":"kct-vl","t":"Vật liệu & tiêu chuẩn thép","g":"KCT","w":[["structural steel","thép kết cấu","All members shall be fabricated from structural steel to AS/NZS 3679.1 Grade 300.","Mọi cấu kiện phải chế tạo từ thép kết cấu theo AS/NZS 3679.1 mác 300."],["steel grade","mác thép","Please confirm the steel grade for the base plates.","Vui lòng xác nhận mác thép cho các bản đế."],["yield strength","giới hạn chảy","Grade 350 plate has a minimum yield strength of 350 MPa.","Thép tấm mác 350 có giới hạn chảy tối thiểu 350 MPa."],["tensile strength","độ bền kéo","The mill certificate shows the tensile strength of each heat.","Chứng chỉ xuất xưởng ghi độ bền kéo của từng mẻ luyện."],["hot-rolled section","thép hình cán nóng","Hot-rolled sections will be sourced from a local mill.","Thép hình cán nóng sẽ mua từ nhà máy trong nước."],["plate","thép tấm","The 25 mm plate is out of stock until next month.","Thép tấm 25 mm hết hàng đến tháng sau."],["hollow section","thép hộp, ống","Square hollow sections are used for the roof bracing.","Thép hộp vuông được dùng cho giằng mái."],["universal beam","dầm chữ I (UB)","Can we substitute the 310UB40 with a heavier section?","Chúng tôi có thể thay 310UB40 bằng tiết diện nặng hơn không?"],["channel","thép chữ U","The purlins are supported by channels at each grid line.","Xà gồ được đỡ bởi thép chữ U tại mỗi trục."],["angle","thép góc (L)","Use equal angles 75x75x6 for the bracing.","Dùng thép góc đều cạnh 75x75x6 cho giằng."],["mill certificate","chứng chỉ xuất xưởng (MTC)","Mill certificates must be traceable to each piece.","Chứng chỉ xuất xưởng phải truy xuất được tới từng chi tiết."],["heat number","số mẻ luyện","The heat number is stamped on every plate.","Số mẻ luyện được đóng trên mỗi tấm thép."],["traceability","khả năng truy xuất","Material traceability is required for all primary members.","Yêu cầu truy xuất vật liệu cho mọi cấu kiện chính."],["equivalent","tương đương","Is JIS SS400 an acceptable equivalent to ASTM A36?","JIS SS400 có được chấp nhận là tương đương ASTM A36 không?"],["substitution","sự thay thế (vật liệu)","Any material substitution needs the engineer's written approval.","Mọi thay thế vật liệu cần kỹ sư phê duyệt bằng văn bản."],["specification","tiêu chuẩn kỹ thuật dự án (spec)","Section 5 of the specification covers welding.","Mục 5 của tiêu chuẩn kỹ thuật quy định về hàn."],["standard","tiêu chuẩn","The project follows Canadian standard CSA W59.","Dự án tuân theo tiêu chuẩn Canada CSA W59."],["tolerance","dung sai","The camber is within the allowable tolerance.","Độ vồng nằm trong dung sai cho phép."],["thickness","chiều dày","The flange thickness is 16 mm.","Chiều dày cánh là 16 mm."],["weight per meter","trọng lượng trên mét","Check the weight per meter against the section table.","Kiểm tra trọng lượng trên mét với bảng tra tiết diện."],["stainless steel","thép không gỉ","The handrails are made of 316 stainless steel.","Tay vịn làm bằng thép không gỉ 316."],["weathering steel","thép chịu thời tiết","Weathering steel does not need painting.","Thép chịu thời tiết không cần sơn."],["impact test","thử va đập (Charpy)","The plate requires a Charpy impact test at 0 °C.","Thép tấm yêu cầu thử va đập Charpy ở 0 °C."],["lead time","thời gian chờ hàng","The lead time for imported plate is about eight weeks.","Thời gian chờ thép tấm nhập khẩu khoảng tám tuần."],["stockist","nhà phân phối thép","We will buy small sections from a local stockist.","Chúng tôi sẽ mua thép hình nhỏ từ nhà phân phối trong nước."]]},{"id":"kct-bv","t":"Bản vẽ & thiết kế","g":"KCT","w":[["shop drawing","bản vẽ gia công","We will submit the shop drawings for approval by Friday.","Chúng tôi sẽ nộp bản vẽ gia công để phê duyệt trước thứ Sáu."],["general arrangement","bản vẽ bố trí chung (GA)","Please refer to the general arrangement drawing for grid lines.","Vui lòng xem bản vẽ bố trí chung để biết các trục."],["erection drawing","bản vẽ lắp dựng","Erection drawings show the mark number of every member.","Bản vẽ lắp dựng ghi mã của từng cấu kiện."],["assembly drawing","bản vẽ cụm chi tiết","Each assembly drawing lists the parts and welds.","Mỗi bản vẽ cụm liệt kê các chi tiết và mối hàn."],["detail","chi tiết","The connection detail is not shown on the design drawing.","Chi tiết liên kết không thể hiện trên bản vẽ thiết kế."],["revision","bản sửa đổi (Rev.)","Please work to Revision C only.","Vui lòng chỉ làm theo bản Rev. C."],["issued for construction","phát hành để thi công (IFC)","We can't start fabrication until the drawings are issued for construction.","Chúng tôi không thể bắt đầu chế tạo cho đến khi bản vẽ được phát hành để thi công."],["RFI","yêu cầu làm rõ thông tin (Request for Information)","We have raised an RFI about the missing dimensions.","Chúng tôi đã gửi RFI về các kích thước bị thiếu."],["clarification","sự làm rõ","We need clarification on the bolt grade.","Chúng tôi cần làm rõ cấp bền bu lông."],["discrepancy","sự không khớp","There is a discrepancy between the plan and the section.","Có sự không khớp giữa mặt bằng và mặt cắt."],["grid line","trục định vị","Column C3 is located at grid line C and 3.","Cột C3 nằm tại trục C và trục 3."],["elevation","mặt đứng; cao độ","The top of steel elevation is +12.500.","Cao độ đỉnh thép là +12.500."],["section","mặt cắt; tiết diện","See section A-A for the bracing layout.","Xem mặt cắt A-A để biết bố trí giằng."],["dimension","kích thước","All dimensions are in millimeters.","Mọi kích thước tính bằng milimét."],["mark number","mã cấu kiện","Every piece must be painted with its mark number.","Mỗi chi tiết phải được sơn mã cấu kiện."],["bill of materials","bảng thống kê vật tư (BOM)","The bill of materials is generated from the 3D model.","Bảng thống kê vật tư được xuất từ mô hình 3D."],["3D model","mô hình 3D","We model the structure in Tekla before detailing.","Chúng tôi dựng mô hình kết cấu bằng Tekla trước khi triển khai chi tiết."],["clash","va chạm (giữa các bộ môn)","The model shows a clash between the beam and a duct.","Mô hình cho thấy va chạm giữa dầm và ống gió."],["approval status","trạng thái phê duyệt","Drawings returned with status B can proceed with comments.","Bản vẽ trả về trạng thái B được tiến hành kèm ý kiến."],["markup","bản vẽ có ghi chú sửa","The engineer sent back a markup with several comments.","Kỹ sư gửi lại bản vẽ ghi chú với nhiều ý kiến."],["transmittal","phiếu chuyển giao tài liệu","Please sign the transmittal to confirm receipt.","Vui lòng ký phiếu chuyển giao để xác nhận đã nhận."],["detailer","người triển khai bản vẽ chi tiết","Our detailers can turn around the comments in two days.","Đội triển khai bản vẽ có thể xử lý ý kiến trong hai ngày."],["camber","độ vồng","The long-span beams need a 20 mm camber.","Các dầm nhịp lớn cần độ vồng 20 mm."],["loading","tải trọng","Please confirm the design loading for the crane beam.","Vui lòng xác nhận tải trọng thiết kế cho dầm cầu trục."],["as-built drawing","bản vẽ hoàn công","As-built drawings are due at handover.","Bản vẽ hoàn công phải nộp khi bàn giao."]]},{"id":"kct-ct","t":"Chế tạo (fabrication)","g":"KCT","w":[["fabrication","sự chế tạo, gia công","Fabrication will start once the shop drawings are approved.","Việc chế tạo sẽ bắt đầu khi bản vẽ gia công được duyệt."],["fabricator","đơn vị gia công kết cấu","We are a steel fabricator based in Vietnam.","Chúng tôi là đơn vị gia công kết cấu thép tại Việt Nam."],["workshop","xưởng","Our workshop has a capacity of 2,000 tonnes per month.","Xưởng của chúng tôi có công suất 2.000 tấn mỗi tháng."],["cutting","cắt","Plates are cut on a CNC plasma cutting machine.","Thép tấm được cắt bằng máy cắt plasma CNC."],["drilling","khoan","All bolt holes shall be drilled, not punched.","Mọi lỗ bu lông phải khoan, không đột."],["punching","đột lỗ","Punching is allowed for plates up to 12 mm thick.","Cho phép đột lỗ với tấm dày đến 12 mm."],["beveling","vát mép","The plate edges need beveling for full penetration welds.","Mép tấm cần vát để hàn ngấu hoàn toàn."],["fit-up","lắp ráp (gá) trước khi hàn","Inspect the fit-up before welding starts.","Kiểm tra lắp gá trước khi bắt đầu hàn."],["tack weld","hàn đính","Tack welds must be made by qualified welders.","Mối hàn đính phải do thợ hàn đủ chứng chỉ thực hiện."],["straightening","nắn thẳng","The column was distorted and needs straightening.","Cột bị biến dạng và cần nắn thẳng."],["distortion","biến dạng (do hàn)","Use a balanced welding sequence to reduce distortion.","Dùng trình tự hàn cân bằng để giảm biến dạng."],["stiffener","sườn tăng cứng","Add stiffeners at the beam-to-column connection.","Thêm sườn tăng cứng tại liên kết dầm–cột."],["end plate","bản mã đầu dầm","The beam has a bolted end plate connection.","Dầm có liên kết bản mã đầu bằng bu lông."],["gusset plate","bản mã giằng","The bracing is bolted to a gusset plate.","Giằng được bắt bu lông vào bản mã."],["base plate","bản đế","The base plate has four anchor bolt holes.","Bản đế có bốn lỗ bu lông neo."],["cleat","bản mã nối (cleat)","Fin plates and cleats are welded in the shop.","Bản mã và cleat được hàn tại xưởng."],["member","cấu kiện","The heaviest member weighs about 12 tonnes.","Cấu kiện nặng nhất khoảng 12 tấn."],["assembly","cụm lắp","The truss is delivered in three assemblies.","Dàn được giao thành ba cụm."],["splice","mối nối","A bolted splice is needed because of transport limits.","Cần mối nối bu lông vì giới hạn vận chuyển."],["camber","độ vồng","The camber was checked after welding.","Độ vồng được kiểm tra sau khi hàn."],["production schedule","kế hoạch sản xuất","We will send you the updated production schedule every Monday.","Chúng tôi sẽ gửi kế hoạch sản xuất cập nhật mỗi thứ Hai."],["capacity","công suất","Our current capacity is fully booked until March.","Công suất hiện tại đã kín đến tháng Ba."],["throughput","sản lượng (đầu ra)","We increased throughput by adding a second shift.","Chúng tôi tăng sản lượng bằng cách thêm ca hai."],["overhead crane","cầu trục trong xưởng","The bay has two 20-tonne overhead cranes.","Nhịp xưởng có hai cầu trục 20 tấn."],["trial assembly","lắp thử tại xưởng","A trial assembly of the dome segment is required before shipment.","Cần lắp thử một phân đoạn mái vòm trước khi xuất hàng."]]},{"id":"kct-han","t":"Hàn & kiểm tra không phá hủy","g":"KCT","w":[["welding","hàn","All welding shall comply with AS/NZS 1554.1.","Mọi công việc hàn phải tuân thủ AS/NZS 1554.1."],["welder","thợ hàn","Only qualified welders may work on this project.","Chỉ thợ hàn có chứng chỉ mới được làm dự án này."],["WPS","quy trình hàn (Welding Procedure Specification)","Please submit the WPS for review before production.","Vui lòng nộp WPS để xem xét trước khi sản xuất."],["PQR","biên bản kiểm định quy trình hàn","The PQR supports the qualified range of the WPS.","PQR chứng minh phạm vi được chấp nhận của WPS."],["fillet weld","mối hàn góc","The drawing calls for a 6 mm fillet weld all around.","Bản vẽ yêu cầu hàn góc 6 mm bao quanh."],["butt weld","mối hàn giáp mép","Flange splices need complete penetration butt welds.","Mối nối cánh cần hàn giáp mép ngấu hoàn toàn."],["full penetration","ngấu hoàn toàn (CJP)","Full penetration welds require 100% ultrasonic testing.","Mối hàn ngấu hoàn toàn cần siêu âm 100%."],["leg length","cạnh mối hàn","The measured leg length was 1 mm undersize.","Cạnh mối hàn đo được thiếu 1 mm."],["undercut","cháy cạnh","Minor undercut was found and repaired.","Phát hiện cháy cạnh nhẹ và đã sửa."],["porosity","rỗ khí","Porosity was caused by moisture on the plate.","Rỗ khí do hơi ẩm trên tấm thép."],["crack","vết nứt","Any crack is cause for rejection.","Bất kỳ vết nứt nào đều bị loại."],["preheat","gia nhiệt trước","Thick plates need preheat to 80 °C.","Tấm dày cần gia nhiệt trước đến 80 °C."],["NDT","kiểm tra không phá hủy","NDT will be performed by an independent third party.","NDT sẽ do bên thứ ba độc lập thực hiện."],["visual inspection","kiểm tra bằng mắt (VT)","All welds receive 100% visual inspection.","Mọi mối hàn được kiểm tra bằng mắt 100%."],["ultrasonic testing","siêu âm (UT)","Ultrasonic testing found an indication in weld W12.","Siêu âm phát hiện chỉ thị ở mối hàn W12."],["magnetic particle testing","kiểm tra từ tính (MT)","Fillet welds are checked by magnetic particle testing at 10%.","Mối hàn góc được kiểm tra từ tính 10%."],["radiographic testing","chụp X-quang (RT)","Radiographic testing is rarely used on structural steel.","Chụp X-quang hiếm khi dùng cho kết cấu thép."],["weld map","sơ đồ mối hàn","The weld map identifies every weld and its NDT level.","Sơ đồ mối hàn xác định từng mối hàn và mức NDT."],["repair","sửa chữa","The repair was re-tested and accepted.","Phần sửa đã được kiểm tra lại và chấp nhận."],["acceptance criteria","tiêu chí chấp nhận","Which acceptance criteria apply: category SP or GP?","Tiêu chí chấp nhận nào áp dụng: hạng SP hay GP?"],["welding inspector","thanh tra hàn","A certified welding inspector will witness the tests.","Một thanh tra hàn có chứng chỉ sẽ chứng kiến thử nghiệm."],["consumables","vật liệu hàn","Welding consumables must be stored in a drying oven.","Vật liệu hàn phải bảo quản trong tủ sấy."],["spatter","bắn tóe (hàn)","Remove weld spatter before blasting.","Loại bỏ xỉ bắn trước khi phun làm sạch."],["qualification","sự sát hạch, chứng nhận","Welder qualification records are attached.","Hồ sơ sát hạch thợ hàn được đính kèm."],["indication","chỉ thị (khuyết tật)","The indication is within acceptable limits.","Chỉ thị nằm trong giới hạn chấp nhận."]]},{"id":"kct-son","t":"Sơn & bảo vệ bề mặt","g":"KCT","w":[["surface preparation","chuẩn bị bề mặt","Surface preparation is the most important step in painting.","Chuẩn bị bề mặt là bước quan trọng nhất khi sơn."],["abrasive blasting","phun hạt làm sạch","Abrasive blasting to Sa 2½ is specified.","Yêu cầu phun hạt làm sạch đạt Sa 2½."],["surface profile","độ nhám bề mặt","The surface profile should be 50 to 75 microns.","Độ nhám bề mặt nên từ 50 đến 75 micron."],["primer","sơn lót","Apply the zinc-rich primer within four hours of blasting.","Sơn lót giàu kẽm trong vòng bốn giờ sau khi phun làm sạch."],["intermediate coat","lớp sơn giữa","The intermediate coat is a high-build epoxy.","Lớp giữa là epoxy dày."],["topcoat","lớp sơn phủ","The topcoat color is RAL 7035.","Màu sơn phủ là RAL 7035."],["coating system","hệ sơn","The coating system must last 15 years to first maintenance.","Hệ sơn phải bền 15 năm đến lần bảo dưỡng đầu tiên."],["dry film thickness","độ dày màng sơn khô (DFT)","Measured DFT was 240 microns on average.","DFT đo được trung bình 240 micron."],["hot-dip galvanizing","mạ kẽm nhúng nóng","Hot-dip galvanizing is required for all external steel.","Mọi thép bên ngoài yêu cầu mạ kẽm nhúng nóng."],["zinc coating","lớp mạ kẽm","The minimum zinc coating mass is 600 g/m².","Khối lượng lớp mạ kẽm tối thiểu là 600 g/m²."],["touch-up","sơn dặm","Damaged areas need touch-up after erection.","Các vùng bị hỏng cần sơn dặm sau lắp dựng."],["humidity","độ ẩm","Do not paint when the relative humidity exceeds 85%.","Không sơn khi độ ẩm tương đối vượt 85%."],["dew point","điểm sương","The steel temperature must be 3 °C above the dew point.","Nhiệt độ thép phải cao hơn điểm sương 3 °C."],["curing","sự đóng rắn (sơn)","Allow full curing before handling.","Chờ sơn đóng rắn hoàn toàn trước khi bốc xếp."],["adhesion test","thử bám dính","A pull-off adhesion test will be done on a test panel.","Thử bám dính kéo sẽ làm trên tấm mẫu."],["holiday","khuyết tật lỗ kim (sơn)","Holiday testing is not required for this project.","Dự án này không yêu cầu kiểm tra lỗ kim."],["masking","che chắn (không sơn)","Faying surfaces must be masked before painting.","Bề mặt tiếp xúc phải được che chắn trước khi sơn."],["faying surface","bề mặt tiếp xúc (liên kết ma sát)","Faying surfaces of slip-critical joints are left unpainted.","Bề mặt tiếp xúc của liên kết chịu trượt được để không sơn."],["fireproofing","chống cháy","Intumescent fireproofing will be applied on site.","Sơn chống cháy trương nở sẽ được thi công tại công trường."],["corrosion","sự ăn mòn","The coastal site has a high corrosion category (C4).","Công trường ven biển có cấp ăn mòn cao (C4)."],["paint data sheet","tài liệu kỹ thuật sơn (TDS)","Follow the paint data sheet for recoat intervals.","Làm theo tài liệu kỹ thuật sơn về thời gian sơn lớp kế."],["color sample","mẫu màu","Please approve the color sample before production.","Vui lòng duyệt mẫu màu trước khi sản xuất."],["blast cleaning","làm sạch bằng phun hạt","Blast cleaning is done in an enclosed booth.","Làm sạch bằng phun hạt được thực hiện trong buồng kín."],["inspection report","biên bản kiểm tra","The paint inspection report includes DFT readings.","Biên bản kiểm tra sơn gồm số đo DFT."],["damage","hư hại","Transport damage to the coating must be recorded.","Hư hại lớp sơn trong vận chuyển phải được ghi nhận."]]},{"id":"kct-bl","t":"Bu lông & liên kết","g":"KCT","w":[["bolt","bu lông","Supply all bolts with nuts and washers.","Cung cấp tất cả bu lông kèm đai ốc và vòng đệm."],["nut","đai ốc","Each nut must match the bolt grade.","Mỗi đai ốc phải cùng cấp bền với bu lông."],["washer","vòng đệm","Hardened washers are required under the turned element.","Cần vòng đệm tôi cứng dưới chi tiết được vặn."],["high-strength bolt","bu lông cường độ cao","High-strength bolts are grade 8.8 to AS/NZS 1252.","Bu lông cường độ cao cấp 8.8 theo AS/NZS 1252."],["anchor bolt","bu lông neo","The anchor bolts are cast into the concrete footing.","Bu lông neo được đổ chôn trong móng bê tông."],["hole diameter","đường kính lỗ","Standard hole diameter is bolt size plus 2 mm.","Đường kính lỗ tiêu chuẩn là cỡ bu lông cộng 2 mm."],["slotted hole","lỗ ô van","Slotted holes allow for thermal movement.","Lỗ ô van cho phép giãn nở nhiệt."],["pretension","lực xiết trước","Slip-critical bolts must be fully pretensioned.","Bu lông chịu trượt phải xiết trước hoàn toàn."],["snug tight","xiết vừa chặt","Bearing-type bolts only need to be snug tight.","Bu lông chịu ép mặt chỉ cần xiết vừa chặt."],["torque","mô-men xoắn","Check the torque with a calibrated wrench.","Kiểm tra mô-men xoắn bằng cờ lê đã hiệu chuẩn."],["turn-of-nut method","phương pháp xoay đai ốc","We use the turn-of-nut method for tensioning.","Chúng tôi dùng phương pháp xoay đai ốc để xiết căng."],["slip-critical connection","liên kết chịu trượt (ma sát)","Slip-critical connections need a Class A surface.","Liên kết chịu trượt cần bề mặt loại A."],["moment connection","liên kết ngàm","The rafter-to-column joint is a moment connection.","Liên kết kèo–cột là liên kết ngàm."],["pinned connection","liên kết khớp","Secondary beams have pinned connections.","Dầm phụ có liên kết khớp."],["shear","lực cắt","The connection is designed for shear only.","Liên kết chỉ được thiết kế chịu cắt."],["bolt group","nhóm bu lông","Increase the bolt group to eight bolts.","Tăng nhóm bu lông lên tám con."],["edge distance","khoảng cách mép","Minimum edge distance is 1.5 times the hole diameter.","Khoảng cách mép tối thiểu bằng 1,5 lần đường kính lỗ."],["pitch","bước (khoảng cách lỗ)","The bolt pitch is 70 mm.","Bước bu lông là 70 mm."],["galvanized bolt","bu lông mạ kẽm","Use galvanized bolts for external connections.","Dùng bu lông mạ kẽm cho liên kết ngoài trời."],["grout","vữa không co ngót","Non-shrink grout is placed under the base plate.","Vữa không co ngót được đổ dưới bản đế."],["shim","miếng chêm","Steel shims are used to level the column.","Dùng miếng chêm thép để cân chỉnh cột."],["template","dưỡng (định vị bu lông)","We will supply templates for setting the anchor bolts.","Chúng tôi sẽ cung cấp dưỡng để định vị bu lông neo."],["bolt list","danh sách bu lông","The bolt list is grouped by connection type.","Danh sách bu lông được nhóm theo loại liên kết."],["spare","dự phòng","Please add 5% spare bolts to each shipment.","Vui lòng thêm 5% bu lông dự phòng mỗi chuyến hàng."],["misalignment","sự lệch (lỗ)","Hole misalignment on site must not be fixed by flame cutting.","Lệch lỗ tại công trường không được sửa bằng cắt lửa."]]},{"id":"kct-qc","t":"Quản lý chất lượng (QA/QC)","g":"KCT","w":[["quality control","kiểm soát chất lượng","Our quality control team checks every member before painting.","Đội QC kiểm tra mọi cấu kiện trước khi sơn."],["quality assurance","đảm bảo chất lượng","The quality assurance plan is based on ISO 9001.","Kế hoạch đảm bảo chất lượng dựa trên ISO 9001."],["ITP","kế hoạch kiểm tra & thử nghiệm (Inspection and Test Plan)","Please mark your hold points on the ITP.","Vui lòng đánh dấu điểm dừng của quý vị trên ITP."],["hold point","điểm dừng (phải chờ chứng kiến)","Blasting is a hold point; we must wait for your inspector.","Phun làm sạch là điểm dừng; chúng tôi phải chờ thanh tra của quý vị."],["witness point","điểm chứng kiến","The client may attend witness points if they wish.","Khách hàng có thể dự các điểm chứng kiến nếu muốn."],["inspection","kiểm tra","Final inspection is scheduled for 10 March.","Kiểm tra cuối được lên lịch ngày 10 tháng 3."],["NCR","báo cáo không phù hợp (Non-Conformance Report)","An NCR was issued for the wrong hole spacing.","Đã phát hành NCR vì khoảng cách lỗ sai."],["corrective action","hành động khắc phục","Please describe the corrective action and root cause.","Vui lòng mô tả hành động khắc phục và nguyên nhân gốc."],["root cause","nguyên nhân gốc","The root cause was an outdated drawing in the shop.","Nguyên nhân gốc là bản vẽ cũ còn trong xưởng."],["dimensional check","kiểm tra kích thước","Dimensional checks are recorded on the QC form.","Kiểm tra kích thước được ghi vào biểu mẫu QC."],["calibration","hiệu chuẩn","All gauges have valid calibration certificates.","Mọi dụng cụ đo đều có giấy hiệu chuẩn còn hiệu lực."],["third-party inspection","kiểm tra bên thứ ba (TPI)","Third-party inspection will be arranged by the client.","Khách hàng sẽ sắp xếp kiểm tra bên thứ ba."],["manufacturer's data report","hồ sơ chất lượng (MDR)","The MDR will be submitted with the final shipment.","Hồ sơ MDR sẽ được nộp cùng chuyến hàng cuối."],["punch list","danh sách tồn tại cần khắc phục","We will close the punch list items this week.","Chúng tôi sẽ xử lý các mục tồn tại trong tuần này."],["audit","đánh giá (audit)","The client's audit of our workshop is next Tuesday.","Buổi đánh giá xưởng của khách hàng là thứ Ba tới."],["procedure","quy trình","Please follow the approved painting procedure.","Vui lòng làm theo quy trình sơn đã phê duyệt."],["record","hồ sơ, biên bản","Keep records of all inspections for seven years.","Lưu hồ sơ mọi lần kiểm tra trong bảy năm."],["release note","phiếu cho phép xuất hàng","The inspector signed the release note for shipment 3.","Thanh tra đã ký phiếu cho xuất chuyến hàng 3."],["reject","loại bỏ, từ chối","The inspector rejected two columns because of twisting.","Thanh tra loại hai cột do bị xoắn."],["concession","chấp nhận nhân nhượng","We request a concession for the minor deviation.","Chúng tôi xin chấp nhận nhân nhượng cho sai lệch nhỏ."],["deviation","sai lệch","Any deviation from the drawing must be reported.","Mọi sai lệch so với bản vẽ phải được báo cáo."],["compliance","sự tuân thủ","The test results show full compliance with the specification.","Kết quả thử cho thấy tuân thủ hoàn toàn tiêu chuẩn."],["verification","sự xác minh","Material verification is done against the mill certificates.","Xác minh vật liệu được đối chiếu với chứng chỉ xuất xưởng."],["checklist","danh mục kiểm tra","Use the pre-shipment checklist for each container.","Dùng danh mục kiểm tra trước giao hàng cho mỗi container."],["sign off","ký duyệt","The client's engineer signed off the trial assembly.","Kỹ sư của khách hàng đã ký duyệt buổi lắp thử."]]},{"id":"kct-vc","t":"Đóng gói, vận chuyển & xuất khẩu","g":"KCT","w":[["packing list","phiếu đóng gói","The packing list shows the weight of each bundle.","Phiếu đóng gói ghi trọng lượng từng bó."],["bundle","bó (hàng)","Small parts are packed in steel-framed bundles.","Chi tiết nhỏ được đóng trong các bó khung thép."],["crate","thùng gỗ","Bolts are shipped in wooden crates.","Bu lông được vận chuyển trong thùng gỗ."],["shipping mark","ký mã hiệu hàng","Each crate must have shipping marks on two sides.","Mỗi thùng phải có ký mã hiệu ở hai mặt."],["container","container","We can load about 22 tonnes into a 40-foot container.","Chúng tôi có thể xếp khoảng 22 tấn vào container 40 feet."],["flat rack","container mặt phẳng (flat rack)","Long trusses will travel on flat racks.","Các dàn dài sẽ đi bằng container flat rack."],["break bulk","hàng rời (không đóng container)","Oversized members will be shipped as break bulk.","Cấu kiện quá khổ sẽ vận chuyển dạng hàng rời."],["lashing","chằng buộc","Proper lashing prevents damage at sea.","Chằng buộc đúng cách tránh hư hại trên biển."],["bill of lading","vận đơn (B/L)","We will send the bill of lading once the vessel departs.","Chúng tôi sẽ gửi vận đơn khi tàu khởi hành."],["commercial invoice","hóa đơn thương mại","The commercial invoice must match the packing list.","Hóa đơn thương mại phải khớp với phiếu đóng gói."],["certificate of origin","giấy chứng nhận xuất xứ (C/O)","A certificate of origin is needed for the tariff exemption.","Cần C/O để được miễn thuế."],["Incoterms","điều kiện giao hàng quốc tế","The price is quoted on FOB Hai Phong under Incoterms 2020.","Giá báo theo FOB Hải Phòng theo Incoterms 2020."],["FOB","giao lên tàu","Under FOB, the buyer arranges the sea freight.","Theo FOB, bên mua thu xếp cước biển."],["CIF","giá thành, bảo hiểm và cước","Under CIF, we pay the freight and insurance to the destination port.","Theo CIF, chúng tôi trả cước và bảo hiểm đến cảng đích."],["vessel","tàu","The vessel is scheduled to depart on 5 May.","Tàu dự kiến khởi hành ngày 5 tháng 5."],["ETD","ngày khởi hành dự kiến","The ETD has been moved to next Friday.","ETD đã dời sang thứ Sáu tới."],["ETA","ngày đến dự kiến","The ETA in Brisbane is 28 May.","ETA tại Brisbane là ngày 28 tháng 5."],["freight forwarder","công ty giao nhận","Our freight forwarder will book the space.","Công ty giao nhận của chúng tôi sẽ đặt chỗ."],["customs clearance","thông quan","Customs clearance usually takes two to three days.","Thông quan thường mất hai đến ba ngày."],["delivery schedule","tiến độ giao hàng","The delivery schedule follows the erection sequence.","Tiến độ giao hàng theo trình tự lắp dựng."],["partial shipment","giao hàng từng phần","Partial shipments are allowed under the contract.","Hợp đồng cho phép giao hàng từng phần."],["loading","xếp hàng","Loading will be supervised by our QC staff.","Việc xếp hàng sẽ do nhân viên QC giám sát."],["oversize","quá khổ","Oversize loads need a police escort on the road.","Hàng quá khổ cần cảnh sát dẫn đường trên đường bộ."],["fumigation","xông khử trùng","Wooden packing must have fumigation certificates (ISPM 15).","Bao bì gỗ phải có giấy xông khử trùng (ISPM 15)."],["consignee","người nhận hàng","The consignee's details are on the bill of lading.","Thông tin người nhận hàng có trên vận đơn."]]},{"id":"kct-ld","t":"Lắp dựng & an toàn công trường","g":"KCT","w":[["erection","lắp dựng","Erection will start in the second week of June.","Lắp dựng sẽ bắt đầu vào tuần thứ hai tháng 6."],["erection sequence","trình tự lắp dựng","Please send the erection sequence so we can plan deliveries.","Vui lòng gửi trình tự lắp dựng để chúng tôi lên kế hoạch giao hàng."],["mobile crane","cẩu bánh lốp","A 100-tonne mobile crane will lift the main trusses.","Cẩu bánh lốp 100 tấn sẽ cẩu các dàn chính."],["lifting lug","tai cẩu","Lifting lugs are welded at the center of gravity.","Tai cẩu được hàn tại trọng tâm."],["rigging","chằng buộc cẩu","The rigging plan must be approved before the lift.","Phương án chằng buộc cẩu phải được duyệt trước khi cẩu."],["temporary bracing","giằng tạm","Temporary bracing stays until the roof is complete.","Giằng tạm giữ lại cho đến khi mái hoàn thành."],["plumb","thẳng đứng","Columns must be checked for plumb before final bolting.","Cột phải được kiểm tra độ thẳng đứng trước khi xiết bu lông cuối."],["alignment","sự căn chỉnh","Use a total station to check the alignment.","Dùng máy toàn đạc để kiểm tra căn chỉnh."],["site","công trường","Our supervisor will be on site from Monday.","Giám sát của chúng tôi sẽ có mặt ở công trường từ thứ Hai."],["site induction","buổi hướng dẫn an toàn đầu vào","All workers must attend the site induction.","Mọi công nhân phải dự buổi hướng dẫn an toàn đầu vào."],["PPE","đồ bảo hộ cá nhân","Hard hats, boots and high-visibility vests are mandatory PPE.","Mũ cứng, giày và áo phản quang là PPE bắt buộc."],["SWMS","bản phương pháp thi công an toàn (Úc)","Submit the SWMS for working at heights.","Nộp SWMS cho công việc làm việc trên cao."],["working at heights","làm việc trên cao","Harnesses are required when working at heights.","Bắt buộc đeo dây an toàn khi làm việc trên cao."],["harness","dây đai an toàn","Check your harness before every shift.","Kiểm tra dây an toàn trước mỗi ca."],["exclusion zone","vùng cấm vào","Set up an exclusion zone under the lift.","Lập vùng cấm vào dưới khu vực cẩu."],["toolbox talk","họp an toàn đầu ca","We hold a toolbox talk every morning at 7.","Chúng tôi họp an toàn đầu ca mỗi sáng lúc 7 giờ."],["incident","sự cố","Report any incident to the site manager immediately.","Báo ngay mọi sự cố cho chỉ huy trưởng."],["near miss","sự cố suýt xảy ra","A near miss was reported during unloading.","Một sự cố suýt xảy ra được báo cáo khi dỡ hàng."],["permit to work","giấy phép làm việc","Hot work needs a permit to work.","Công việc phát sinh nhiệt cần giấy phép làm việc."],["hot work","công việc phát sinh nhiệt (hàn, cắt)","No hot work is allowed near the fuel tank.","Không được làm công việc phát sinh nhiệt gần bồn nhiên liệu."],["survey","khảo sát, trắc đạc","The surveyor will check the anchor bolt positions.","Trắc đạc sẽ kiểm tra vị trí bu lông neo."],["handover","bàn giao","Handover to the client is planned for the end of August.","Dự kiến bàn giao cho khách hàng vào cuối tháng 8."],["site diary","nhật ký công trường","Record the weather delays in the site diary.","Ghi các chậm trễ do thời tiết vào nhật ký công trường."],["progress report","báo cáo tiến độ","The weekly progress report includes photos.","Báo cáo tiến độ hằng tuần có kèm ảnh."],["delay","sự chậm trễ","The delay was caused by strong winds.","Sự chậm trễ do gió mạnh."]]},{"id":"kct-hd","t":"Hợp đồng, báo giá & thương mại","g":"KCT","w":[["tender","hồ sơ mời thầu; dự thầu","The tender closes at 2 p.m. on 15 April.","Đóng thầu lúc 2 giờ chiều ngày 15 tháng 4."],["bid","giá dự thầu","We submitted our bid one day early.","Chúng tôi đã nộp giá dự thầu sớm một ngày."],["quotation","bảng báo giá","Our quotation is valid for 30 days.","Báo giá của chúng tôi có hiệu lực 30 ngày."],["unit rate","đơn giá","The unit rate is USD 2,150 per tonne.","Đơn giá là 2.150 USD mỗi tấn."],["lump sum","trọn gói","The contract is a lump sum for supply and delivery.","Hợp đồng là trọn gói cho cung cấp và giao hàng."],["bill of quantities","bảng khối lượng (BOQ)","Please fill in the bill of quantities with your rates.","Vui lòng điền đơn giá vào bảng khối lượng."],["takeoff","bóc tách khối lượng","Our takeoff gives a total of 480 tonnes.","Bóc tách của chúng tôi cho tổng 480 tấn."],["scope of work","phạm vi công việc","Painting is excluded from our scope of work.","Sơn không nằm trong phạm vi công việc của chúng tôi."],["exclusion","hạng mục loại trừ","Please see the list of exclusions in Appendix A.","Vui lòng xem danh sách loại trừ ở Phụ lục A."],["assumption","giả định","Our price is based on the following assumptions.","Giá của chúng tôi dựa trên các giả định sau."],["variation","phát sinh (thay đổi hợp đồng)","Additional bracing will be treated as a variation.","Giằng bổ sung sẽ được tính là phát sinh."],["claim","yêu cầu bồi thường; đòi thanh toán","We will submit a claim for the extra standby time.","Chúng tôi sẽ nộp yêu cầu thanh toán cho thời gian chờ thêm."],["payment terms","điều khoản thanh toán","Payment terms are 30% advance and 70% against shipping documents.","Điều khoản thanh toán: tạm ứng 30% và 70% khi có chứng từ giao hàng."],["letter of credit","thư tín dụng (L/C)","The letter of credit must be opened before production.","Thư tín dụng phải được mở trước khi sản xuất."],["advance payment","tạm ứng","The advance payment is secured by a bank guarantee.","Khoản tạm ứng được bảo đảm bằng bảo lãnh ngân hàng."],["retention","tiền giữ lại (bảo hành)","Five percent retention is released after the defects period.","5% tiền giữ lại được trả sau thời gian bảo hành."],["liquidated damages","tiền phạt chậm tiến độ (LD)","Liquidated damages are capped at 10% of the contract value.","Tiền phạt chậm tiến độ giới hạn ở 10% giá trị hợp đồng."],["purchase order","đơn đặt hàng (PO)","We have received your purchase order, thank you.","Chúng tôi đã nhận được đơn đặt hàng, xin cảm ơn."],["negotiate","đàm phán","We are willing to negotiate the delivery date.","Chúng tôi sẵn sàng đàm phán ngày giao hàng."],["escalation","điều chỉnh giá (trượt giá)","The steel price escalation clause applies after 60 days.","Điều khoản trượt giá thép áp dụng sau 60 ngày."],["warranty period","thời gian bảo hành","The warranty period is 12 months after handover.","Thời gian bảo hành là 12 tháng sau bàn giao."],["milestone","mốc thanh toán/tiến độ","Payment is made at each milestone.","Thanh toán theo từng mốc."],["award","trao thầu","We were awarded the contract last week.","Chúng tôi được trao hợp đồng tuần trước."],["subcontractor","nhà thầu phụ","We act as a subcontractor to the main builder.","Chúng tôi là nhà thầu phụ của tổng thầu."],["main contractor","tổng thầu","The main contractor controls the site program.","Tổng thầu quản lý tiến độ công trường."]]},{"id":"vp-hop","t":"Họp & thuyết trình","g":"VP","w":[["agenda","chương trình họp","The first item on the agenda is the budget.","Mục đầu tiên trong chương trình họp là tem is currently in stock.","Mặt hàng hiện còn hàng."],["out of stock","hết hàng","That model is out of stock.","Mẫu đó đã hết hàng."],["warranty","bảo hành","The product comes with a two-year warranty.","Sản phẩm được bảo hành hai năm."],["complaint","lời phàn nàn, khiếu nại","We handle every complaint within 48 hours.","Chúng tôi xử lý mọi khiếu nại trong 48 giờ."],["refund","hoàn tiền","Customers can request a full refund within 30 days.","Khách hàng có thể yêu cầu hoàn tiền toàn bộ trong 30 ngày."],["loyal customer","khách hàng thân thiết","Loyal customers receive a special discount.","Khách hàng thân thiết được giảm giá đặc biệt."],["negotiate","đàm phán","We negotiated a better price.","Chúng tôi đã đàm phán được giá tốt hơn."],["deal","thỏa thuận","We closed the deal last week.","Chúng tôi đã chốt thỏa thuận tuần trước."],["client base","tệp khách hàng","We have a strong client base in Japan.","Chúng tôi có tệp khách hàng vững ở Nhật."],["reputation","danh tiếng","The company has a good reputation for quality.","Công ty có danh tiếng tốt về chất lượng."],["feedback","phản hồi","Customer feedback helps us improve.","Phản hồi của khách hàng giúp chúng tôi cải thiện."]]}]/*TPEND*/;

{id:'g1',c:'Từ loại',t:'Vị trí của danh từ, tính từ, trạng từ, động từ',s:'Dạng câu “chọn đúng dạng từ” chiếm khoảng 1/3 Part 5. Chỉ cần nhìn vị trí chỗ trống là chọn được.',
f:['a/the/my + (adj) + N','be/become/seem + adj','adv + V / V + O + adv','adv + adj / adv + adv','S + V (động từ chia thì)'],

['Our team ------- the final inspection yesterday.',['completed','was completed','is completed','completing'],'Có tân ngữ “the final inspection” → chủ động.'],
['The problem ------- shortly after the update.',['occurred','was occurred','is occurred','has been occurred'],'occur là nội động từ, không bị động.']]},
{id:'g8',c:'Hòa hợp',t:'Hòa hợp chủ ngữ – động từ',s:'Tìm chủ ngữ thật (bỏ qua cụm giới từ, mệnh đề chen giữa) rồi chia động từ.',
f:['N1 + of + N2 → chia theo N1','Each/Every/Either/Neither + N số ít → V số ít','The number of + N(s) → V số ít; A number of + N(s) → V số nhiều','Danh động từ / mệnh đề làm chủ ngữ → V số ít'],
pts:[['Cụm giới từ không ảnh hưởng chủ ngữ.','The list of suppliers is attached.','Danh sách nhà cung cấp được đính kèm.'],
['each/every → số ít.','Each member has a mark number.','Mỗi cấu kiện có một mã.'],
['The number of → số ít.','The number of applicants has increased.','Số lượng ứng viên đã tăng.'],
['Danh từ không đếm được → số ít.','The equipment is ready.','Thiết bị đã sẵn sàng.']],
tip:'Gặp chủ ngữ dài, gạch chân danh từ chính đứng đầu.',
q:[['The results of the survey ------- that customers want faster delivery.',['show','shows','showing','has shown'],'Chủ ngữ chính “results” số nhiều.'],
['Every employee ------- to attend the safety training.',['is required','are required','require','requiring'],'Every + N số ít.'],
['A number of clients ------- complained about the delay.',['have','has','is','was'],'A number of + N số nhiều → V số nhiều.'],
['Reviewing contracts ------- a lot of time.',['takes','take','are taking','have taken'],'V-ing làm chủ ngữ → số ít.'],
['Neither the manager nor the engineers ------- available today.',['are','is','was','has'],'neither...nor → chia theo chủ ngữ gần (engineers).']]},
{id:'g9',c:'Đại từ',t:'Đại từ nhân xưng, sở hữu, phản thân',s:'Chọn đúng chức năng: chủ ngữ (I/he/they), tân ngữ (me/him/them), sở hữu (my/his + N), đại từ sở hữu (mine/his), phản thân (myself).',
f:['Chủ ngữ: I, you, he, she, it, we, they','Tân ngữ: me, you, him, her, it, us, them','Tính từ sở hữu + N: my, your, his, her, its, our, their','Đại từ sở hữu: mine, yours, his, hers, ours, theirs','Phản thân: myself... ; by oneself = tự mình'],
pts:[['Trước danh từ → tính từ sở hữu.','Please send us your updated schedule.','Vui lòng gửi tiến độ cập nhật của anh.'],
['Sau động từ/giới từ → tân ngữ.','Please contact me directly.','Vui lòng liên hệ trực tiếp với tôi.'],
['Đứng một mình thay cho cụm sở hữu + N → đại từ sở hữu.','Our price is lower than theirs.','Giá của chúng tôi thấp hơn giá của họ.'],
['Chủ ngữ và tân ngữ là một người, hoặc nhấn mạnh → phản thân.','The director herself will present the award.','Chính giám đốc sẽ trao giải.']],
tip:'“by + phản thân” = một mình; “on one’s own” = tự làm.',
q:[['Mr. Kim asked ------- assistant to book a hotel.',['his','him','himself','he'],'Trước danh từ assistant → tính từ sở hữu.'],
['The client thanked ------- for the quick delivery.',['us','we','our','ours'],'Sau động từ → tân ngữ.'],
['Ms. Gray prepared the presentation by -------.',['herself','her','hers','she'],'by + phản thân = một mình.'],
['This laptop is not mine; it is -------.',['hers','her','herself','she'],'Đại từ sở hữu đứng một mình.'],
['Employees should keep ------- desks tidy.',['their','them','they','theirs'],'Trước danh từ desks → tính từ sở hữu.']]},
{id:'g10',c:'Danh từ',t:'Mạo từ & danh từ đếm được / không đếm được',s:'Danh từ đếm được số ít luôn cần a/an/the/my... Một số danh từ TOEIC KHÔNG đếm được.',
f:['Không đếm được: information, equipment, furniture, luggage/baggage, advice, feedback, machinery, merchandise, staff (tập hợp), research, access','a/an + N số ít đếm được','much/little + không đếm được; many/few + số nhiều'],
pts:[['Không thêm -s và không dùng a/an với danh từ không đếm được.','We need more information.','Chúng tôi cần thêm thông tin.'],
['Dùng “a piece of” để đếm.','She gave me a useful piece of advice.','Cô ấy cho tôi một lời khuyên hữu ích.'],
['the: vật đã xác định hoặc duy nhất.','The contract we signed yesterday is attached.','Hợp đồng chúng ta ký hôm qua được đính kèm.']],
tip:'Câu có chỗ trống trước danh từ số ít đếm được mà không có mạo từ → đáp án thường là danh từ không đếm được hoặc số nhiều.',
q:[['All ------- must be checked before it is shipped.',['equipment','equipments','an equipment','equips'],'equipment không đếm được, động từ is số ít.'],
['Thank you for your helpful -------.',['feedback','feedbacks','a feedback','feeds'],'feedback không đếm được.'],
['We received ------- complaints this month than last month.',['fewer','less','little','much'],'complaints đếm được số nhiều → fewer.'],
['There isn\'t ------- time left before the deadline.',['much','many','few','a few'],'time không đếm được → much.'],
['Please store your ------- in the lockers provided.',['luggage','luggages','a luggage','luggaging'],'luggage không đếm được.']]}
,
{id:'g11',c:'Danh từ',t:'Lượng từ: each, every, all, most, few, little...',s:'Lượng từ quyết định danh từ số ít / số nhiều / không đếm được theo sau.',
f:['each / every + N số ít','all / most / some + N số nhiều hoặc không đếm được','most of the + N; almost all + N (almost là trạng từ)','a few / few + N số nhiều; a little / little + không đếm được','another + N số ít; other + N số nhiều; the others'],
pts:[['each có thể đứng một mình hoặc “each of the + N số nhiều”.','Each of the members is labeled.','Mỗi cấu kiện đều được dán nhãn.'],
['most + N chung; most of the + N xác định.','Most of the staff live nearby.','Phần lớn nhân viên sống gần đây.'],
['few = rất ít (tiêu cực); a few = một vài.','Few applicants met the requirements.','Rất ít ứng viên đáp ứng yêu cầu.'],
['another + số ít; others thay cho danh từ số nhiều.','Please send another copy.','Vui lòng gửi thêm một bản.']],
tip:'“almost” không đứng trực tiếp trước danh từ: dùng almost all / almost every.',
q:[['------- employee must wear an ID badge.',['Every','All','Most','Few'],'Danh từ số ít employee → Every.'],
['------- of the documents have been translated.',['Most','Every','Each other','Almost'],'Most of the + N số nhiều.'],
['We have only ------- time to prepare the bid.',['a little','a few','many','several'],'time không đếm được.'],
['------- of the two proposals is acceptable.',['Either','Both','All','Several'],'Hai lựa chọn, động từ số ít → Either.'],
['Please let us know if you need ------- assistance.',['any','many','a few','every'],'assistance không đếm được; câu điều kiện → any.']]},
{id:'g12',c:'Giới từ',t:'Giới từ thời gian',s:'at (giờ), on (ngày/thứ), in (tháng/năm/buổi); by (không muộn hơn) vs until (kéo dài đến); within/during/for/throughout.',
f:['at 9 a.m. / on Monday, on 5 May / in June, in 2026, in the morning','by Friday = trước hoặc đúng thứ Sáu (hạn chót)','until Friday = kéo dài liên tục đến thứ Sáu','for + khoảng thời gian; during + danh từ sự kiện; within + khoảng thời gian (trong vòng)','prior to = before; following = after'],
pts:[['by: hạn chót.','Please submit the report by Friday.','Vui lòng nộp báo cáo trước thứ Sáu.'],
['until: trạng thái kéo dài.','The office will be closed until Monday.','Văn phòng đóng cửa đến thứ Hai.'],
['within: trong vòng (không vượt quá).','We reply to inquiries within 24 hours.','Chúng tôi trả lời yêu cầu trong vòng 24 giờ.'],
['during + danh từ; for + số lượng thời gian.','Phones must be turned off during the meeting.','Điện thoại phải tắt trong suốt cuộc họp.']],
tip:'Động từ một lần (submit, finish, arrive) đi với by; động từ kéo dài (stay, wait, remain, be closed) đi với until.',
q:[['The final drawings must be submitted ------- 30 June.',['by','until','during','since'],'Hạn chót → by.'],
['The road will remain closed ------- the end of the week.',['until','by','within','at'],'remain (kéo dài) → until.'],
['Refunds will be processed ------- five business days.',['within','during','since','at'],'trong vòng → within.'],
['No one may leave the room ------- the examination.',['during','for','while','within'],'during + danh từ sự kiện.'],
['------- to the meeting, please read the attached agenda.',['Prior','Before','Ahead','Previous'],'prior to = trước khi.']]},
{id:'g13',c:'Giới từ',t:'Cụm giới từ hay gặp trong TOEIC',s:'Học cả cụm, vì đề thường cho chỗ trống ở giữa cụm.',
f:['in accordance with / in compliance with = theo, tuân theo','due to / because of / owing to + N = do, vì','regardless of = bất kể','in addition to / apart from = ngoài ra','according to = theo (nguồn)','on behalf of = thay mặt','in charge of = phụ trách','instead of = thay vì','as of + mốc = kể từ','in response to = để đáp lại'],
pts:[['in accordance with.','All work must be done in accordance with the specification.','Mọi công việc phải làm theo tiêu chuẩn kỹ thuật.'],
['due to + danh từ.','The flight was delayed due to bad weather.','Chuyến bay bị hoãn do thời tiết xấu.'],
['regardless of.','The price is fixed regardless of the exchange rate.','Giá cố định bất kể tỷ giá.'],
['as of.','As of 1 July, the new rates will apply.','Kể từ 1/7, giá mới sẽ áp dụng.']],
tip:'Sau giới từ là danh từ/V-ing, không phải mệnh đề.',
q:[['Mr. Lee will speak ------- behalf of the director.',['on','in','at','for'],'on behalf of.'],
['Ms. Diaz is in charge ------- the new project.',['of','for','with','to'],'in charge of.'],
['------- the heavy rain, the match was canceled.',['Due to','Although','Because','Since'],'Theo sau là cụm danh từ → Due to.'],
['The product was designed in ------- with safety regulations.',['compliance','comply','compliant','complying'],'in compliance with.'],
['------- the CEO, sales will double next year.',['According to','Instead of','Regardless of','As of'],'Theo lời CEO → According to.']]},
{id:'g14',c:'Liên từ',t:'Liên từ vs giới từ (although/despite, because/because of)',s:'Liên từ + mệnh đề (S + V). Giới từ + danh từ/V-ing.',
f:['although / even though / though + S + V','despite / in spite of + N / V-ing','because / since / as + S + V','because of / due to + N','while / whereas + S + V (trong khi, còn)','unless = if...not'],
pts:[['although + mệnh đề.','Although the price is high, the quality is excellent.','Mặc dù giá cao, chất lượng rất tốt.'],
['despite + danh từ.','Despite the delay, the project was completed on budget.','Dù chậm, dự án vẫn hoàn thành trong ngân sách.'],
['because + mệnh đề; because of + danh từ.','We changed the supplier because their prices rose.','Chúng tôi đổi nhà cung cấp vì họ tăng giá.'],
['unless = nếu không.','The order will be canceled unless payment is received.','Đơn hàng sẽ bị hủy nếu không nhận được thanh toán.']],
tip:'Nhìn sau chỗ trống: có động từ chia → liên từ; chỉ có danh từ → giới từ.',
q:[['------- the bad weather, the crane operator continued working.',['Despite','Although','Even though','Because'],'Theo sau là cụm danh từ.'],
['------- the shipment was late, the client did not complain.',['Although','Despite','In spite of','Because of'],'Theo sau là mệnh đề.'],
['The event was postponed ------- the speaker was ill.',['because','because of','due to','despite'],'Theo sau là mệnh đề → because.'],
['You cannot enter the site ------- you have completed the induction.',['unless','despite','because of','in spite of'],'unless + mệnh đề.'],
['Sales rose in Asia, ------- they fell in Europe.',['whereas','despite','because of','in spite'],'Tương phản hai mệnh đề → whereas.']]},
{id:'g15',c:'Liên từ',t:'Liên từ tương quan',s:'Các cặp đi với nhau cố định. Đề thường cho một nửa, bạn chọn nửa còn lại.',
f:['both A and B','either A or B','neither A nor B','not only A but (also) B','whether A or B','A as well as B'],
pts:[['both...and → chủ ngữ số nhiều.','Both the manager and the engineer are on site.','Cả trưởng phòng và kỹ sư đều ở công trường.'],
['either...or / neither...nor → chia theo chủ ngữ gần.','Either Mr. Sato or his assistants are going to call you.','Ông Sato hoặc các trợ lý sẽ gọi cho anh.'],
['not only...but also.','The new model is not only lighter but also cheaper.','Mẫu mới không những nhẹ hơn mà còn rẻ hơn.']],
tip:'Thấy “neither” → tìm “nor”; thấy “either” → tìm “or”.',
q:[['The position requires ------- technical skills and good communication.',['both','either','neither','not only'],'... and → both.'],
['You can pay ------- by credit card or by bank transfer.',['either','neither','both','whether'],'... or → either.'],
['Neither the supplier ------- the contractor accepted responsibility.',['nor','or','and','but'],'neither ... nor.'],
['The software is not only fast ------- easy to use.',['but also','and also','as well','or'],'not only ... but also.'],
['We have not decided ------- to accept the offer or not.',['whether','either','if not','both'],'whether ... or not.']]},
{id:'g16',c:'Liên từ',t:'Trạng từ liên kết (Part 6)',s:'Nối hai câu độc lập về nghĩa: thường đứng đầu câu sau dấu chấm/chấm phẩy, theo sau là dấu phẩy.',
f:['Tương phản: however, nevertheless, on the other hand','Kết quả: therefore, thus, as a result, consequently','Bổ sung: moreover, furthermore, in addition, also','Điều kiện: otherwise (nếu không thì)','Ví dụ: for example, for instance','Thời gian: meanwhile, afterward, subsequently'],
pts:[['however: tuy nhiên.','The price is reasonable. However, the lead time is too long.','Giá hợp lý. Tuy nhiên, thời gian chờ hàng quá dài.'],
['therefore: do đó.','The crane broke down. Therefore, the lift was postponed.','Cẩu bị hỏng. Do đó việc cẩu bị hoãn.'],
['otherwise: nếu không thì.','Please confirm today; otherwise, we will lose the booking.','Vui lòng xác nhận hôm nay; nếu không, chúng ta sẽ mất chỗ.'],
['in addition: ngoài ra.','The hotel offers free Wi-Fi. In addition, breakfast is included.','Khách sạn có Wi-Fi miễn phí. Ngoài ra còn gồm bữa sáng.']],
tip:'Part 6: đọc câu TRƯỚC và câu SAU chỗ trống để xác định quan hệ (trái ngược, nguyên nhân–kết quả, bổ sung).',
q:[['The hotel is close to the airport. -------, it offers a free shuttle.',['In addition','However','Otherwise','Nevertheless'],'Bổ sung thông tin tích cực.'],
['Our sales increased by 20%. -------, profits fell because of higher costs.',['However','Therefore','Moreover','For example'],'Tương phản.'],
['Please back up your files; -------, you may lose your data.',['otherwise','however','therefore','moreover'],'Nếu không thì.'],
['The supplier missed three deadlines. -------, we decided to end the contract.',['As a result','However','For instance','Meanwhile'],'Kết quả.'],
['The CEO will arrive at 10 a.m. -------, the staff will prepare the meeting room.',['Meanwhile','Otherwise','However','Nevertheless'],'Trong lúc đó.']]},
{id:'g17',c:'Mệnh đề',t:'Mệnh đề quan hệ',s:'who (người – chủ ngữ), whom (người – tân ngữ), which (vật), that (người/vật, không sau dấu phẩy), whose (sở hữu), where/when.',
f:['N(người) + who + V','N(vật) + which/that + V','N + whose + N + V','N(nơi) + where + S + V','giới từ + which/whom'],
pts:[['who làm chủ ngữ.','The engineer who designed the roof is from Canada.','Kỹ sư thiết kế mái đến từ Canada.'],
['whose + danh từ.','We need a supplier whose prices are competitive.','Chúng tôi cần nhà cung cấp có giá cạnh tranh.'],
['which sau dấu phẩy (không dùng that).','The report, which was due yesterday, is still missing.','Báo cáo, hạn nộp hôm qua, vẫn chưa có.'],
['where = in which.','This is the workshop where the trusses are assembled.','Đây là xưởng nơi các dàn được lắp.']],
tip:'Sau chỗ trống là danh từ không mạo từ → whose. Sau chỗ trống là động từ → who/which/that.',
q:[['Applicants ------- have experience in steel fabrication are preferred.',['who','which','whose','whom'],'Người + động từ → who.'],
['The company, ------- headquarters are in Osaka, has 3,000 employees.',['whose','which','who','that'],'+ danh từ headquarters → whose.'],
['The machine ------- we bought last year is very reliable.',['that','who','whose','where'],'Vật làm tân ngữ → that/which.'],
['This is the hotel ------- the conference will be held.',['where','which','whose','who'],'Nơi chốn + mệnh đề đầy đủ → where.'],
['The person to ------- you should send the invoice is Ms. Clark.',['whom','who','which','whose'],'Sau giới từ, chỉ người → whom.']]},
{id:'g18',c:'Mệnh đề',t:'Rút gọn mệnh đề quan hệ & phân từ',s:'Chủ động → V-ing; bị động → V3 (V-ed).',
f:['N + V-ing (= who/which + V chủ động)','N + V3 (= which + be + V3)','V-ing / V3 đầu câu (phân từ) cùng chủ ngữ với mệnh đề chính'],
pts:[['Chủ động → V-ing.','Employees working night shifts receive extra pay.','Nhân viên làm ca đêm được trả thêm.'],
['Bị động → V3.','The documents attached to this email are confidential.','Tài liệu đính kèm email này là bảo mật.'],
['Phân từ đầu câu.','Located near the port, the factory can ship quickly.','Nằm gần cảng, nhà máy có thể giao hàng nhanh.']],
tip:'Hỏi: danh từ TỰ làm (V-ing) hay BỊ làm (V3)? “the attached file”, “the enclosed form”, “the remaining items”.',
q:[['Please read the instructions ------- with the product.',['included','including','include','includes'],'Hướng dẫn được kèm → V3.'],
['Customers ------- more than $100 will receive a gift.',['spending','spent','spend','to spending'],'Khách hàng chi tiêu → chủ động V-ing.'],
['------- in 1995, the company now has offices in five countries.',['Founded','Founding','Found','To found'],'Công ty được thành lập → V3.'],
['The ------- items will be shipped next week.',['remaining','remained','remain','remains'],'Các mặt hàng còn lại → remaining.'],
['Please complete the ------- form and return it to HR.',['enclosed','enclosing','enclose','enclosure'],'Mẫu đơn được gửi kèm → enclosed.']]},
{id:'g19',c:'Động từ',t:'To V hay V-ing sau động từ',s:'Một số động từ đi với to V, một số đi với V-ing; một số đi với cả hai nhưng khác nghĩa.',
f:['+ to V: want, plan, decide, agree, hope, expect, offer, refuse, promise, afford, aim, intend, fail','+ V-ing: avoid, consider, finish, suggest, recommend, enjoy, mind, postpone, delay, keep, involve','+ O + to V: ask, allow, require, encourage, advise, remind, invite, enable','look forward to / be used to / be committed to + V-ing'],
pts:[['to V.','We plan to expand into Canada.','Chúng tôi dự định mở rộng sang Canada.'],
['V-ing.','We suggest using galvanized bolts.','Chúng tôi đề nghị dùng bu lông mạ kẽm.'],
['O + to V.','The new system allows us to track every shipment.','Hệ thống mới cho phép chúng tôi theo dõi mọi lô hàng.'],
['to ở đây là giới từ → V-ing.','We look forward to working with you.','Chúng tôi mong được hợp tác với quý vị.']],
tip:'“look forward to”, “be committed to”, “be dedicated to”, “in addition to” → V-ing.',
q:[['We look forward to ------- from you soon.',['hearing','hear','heard','be heard'],'look forward to + V-ing.'],
['The manager decided ------- the meeting.',['to postpone','postponing','postpone','postponed'],'decide + to V.'],
['Please avoid ------- the machine during maintenance.',['using','to use','use','used'],'avoid + V-ing.'],
['The new policy encourages employees ------- public transport.',['to use','using','use','used'],'encourage + O + to V.'],
['Our company is committed to ------- high-quality products.',['providing','provide','provided','provides'],'be committed to + V-ing.']]},
{id:'g20',c:'Động từ',t:'Động từ khuyết thiếu & thức giả định',s:'Sau modal là V nguyên mẫu. Sau recommend/suggest/request/require/insist + that → S + V nguyên mẫu (không chia).',
f:['can/could/may/might/must/should/will/would + V','It is essential/important/necessary that + S + V nguyên mẫu','recommend/request/require/suggest that + S + (should) V','should have V3 = lẽ ra nên'],
pts:[['Modal + V.','You should submit the form before Friday.','Anh nên nộp mẫu đơn trước thứ Sáu.'],

tip:'Thấy “recommend that he ------” → chọn động từ nguyên mẫu (submit), không chọn submits.',

{id:'g21',c:'Câu',t:'Câu điều kiện & đảo ngữ điều kiện',s:'Loại 1: có thể xảy ra; loại 2: không có thật ở hiện tại; loại 3: không có thật ở quá khứ. TOEIC hay ra đảo ngữ “Should you...”.',
f:['Loại 1: If + hiện tại, will + V','Loại 2: If + quá khứ (were), would + V','Loại 3: If + had V3, would have V3','Đảo ngữ: Should you need... = If you should need...; Had we known... = If we had known...'],
pts:[['Loại 1.','If you order today, we will deliver on Monday.','Nếu anh đặt hôm nay, chúng tôi sẽ giao thứ Hai.'],
['Loại 2.','If we had more workers, we would finish sooner.','Nếu có thêm công nhân, chúng ta sẽ xong sớm hơn.'],
['Loại 3.','If the bolts had arrived, we would have started erection.','Nếu bu lông đã tới, chúng tôi đã bắt đầu lắp dựng.'],
['Đảo ngữ Should (rất hay gặp trong email).','Should you have any questions, please contact me.','Nếu anh có câu hỏi nào, xin liên hệ tôi.']],
tip:'Đầu câu có chỗ trống + “you have any questions” → Should.',
q:[['------- you require further information, please call our office.',['Should','If','Had','Were'],'Đảo ngữ loại 1 → Should + S + V.'],
['If the price ------- lower, we would place a larger order.',['were','is','will be','had been'],'Loại 2 → were.'],
['If we had known about the problem, we ------- it earlier.',['would have fixed','will fix','would fix','fixed'],'Loại 3.'],
['If the client approves the drawings today, we ------- production tomorrow.',['will start','would start','started','would have started'],'Loại 1.'],
['------- the shipment been delayed, we would have missed the deadline.',['Had','Should','Were','If'],'Đảo ngữ loại 3: Had + S + V3.']]},
{id:'g22',c:'Câu',t:'So sánh',s:'So sánh hơn (-er/more + than), nhất (the -est/most), bằng (as...as), kép (the more..., the more...).',
f:['adj-er / more adj + than','the + adj-est / the most adj (+ of/in)','as + adj/adv + as','the + so sánh hơn, the + so sánh hơn','Nhấn mạnh so sánh hơn: much/far/even/significantly + -er'],
pts:[['So sánh hơn.','This model is lighter than the old one.','Mẫu này nhẹ hơn mẫu cũ.'],
['So sánh nhất.','It is the most reliable supplier in the region.','Đó là nhà cung cấp đáng tin cậy nhất khu vực.'],
['So sánh bằng.','Please reply as soon as possible.','Vui lòng trả lời càng sớm càng tốt.'],
['So sánh kép.','The earlier you book, the cheaper the fare.','Đặt càng sớm, giá vé càng rẻ.']],
tip:'very KHÔNG đứng trước so sánh hơn; dùng much/far/even.',
q:[['This year\'s profits were ------- higher than last year\'s.',['much','very','more','most'],'Nhấn mạnh so sánh hơn → much.'],
['Ms. Sato is the ------- candidate we have interviewed.',['most qualified','more qualified','qualified','qualifiedly'],'the + so sánh nhất.'],
['The new office is twice as large ------- the old one.',['as','than','so','like'],'as ... as.'],
['The ------- we finish, the sooner we can ship.',['faster','fastest','fast','more fast'],'So sánh kép.'],
['Our prices are ------- than those of our competitors.',['lower','low','lowest','more low'],'than → so sánh hơn.']]},
{id:'g23',c:'Từ loại',t:'Tính từ đuôi -ing và -ed',s:'-ing: gây ra cảm xúc / bản chất của sự vật. -ed: người cảm thấy.',
f:['interesting / interested','satisfying / satisfied','disappointing / disappointed','confusing / confused','exciting / excited'],
pts:[['Sự vật gây ra cảm xúc → -ing.','The results were disappointing.','Kết quả thật đáng thất vọng.'],
['Người cảm thấy → -ed.','The client was satisfied with the quality.','Khách hàng hài lòng với chất lượng.'],
['Trước danh từ chỉ vật → thường -ing.','It was an exciting opportunity.','Đó là một cơ hội thú vị.']],
tip:'Hỏi: ai/cái gì gây ra cảm xúc? Người cảm thấy → -ed.',
q:[['The staff were ------- by the sudden announcement.',['surprised','surprising','surprise','surprisingly'],'Người cảm thấy → -ed.'],
['The instructions were very -------, so we called support.',['confusing','confused','confuse','confusion'],'Hướng dẫn gây bối rối → -ing.'],
['We are ------- in your proposal.',['interested','interesting','interest','interestingly'],'be interested in.'],
['The sales figures for the quarter were -------.',['encouraging','encouraged','encourage','encouragement'],'Số liệu gây khích lệ → -ing.'],
['Customers who are ------- with the service may request a refund.',['dissatisfied','dissatisfying','dissatisfy','dissatisfaction'],'Khách hàng cảm thấy → -ed.']]},
{id:'g24',c:'Từ loại',t:'Danh từ chỉ người vs danh từ chỉ việc; danh từ ghép',s:'Nhiều câu cho cùng gốc: applicant/application, attendee/attendance, supervisor/supervision. Chọn theo nghĩa và mạo từ.',

pts:[['Người.','The successful applicant will start in March.','Ứng viên trúng tuyển sẽ bắt đầu vào tháng 3.'],
['Việc/hành động.','Your application has been received.','Đơn của anh đã được nhận.'],
['Danh từ ghép: danh từ đầu thường ở dạng số ít.','Please follow the safety regulations.','Vui lòng tuân theo quy định an toàn.']],

q:[['------- at the seminar was higher than expected.',['Attendance','Attendee','Attend','Attended'],'Sự tham dự (không có mạo từ, động từ was) → Attendance.'],
['Each ------- will receive a name badge.',['participant','participation','participate','participatory'],'Each + người → participant.'],
['The project was completed under the ------- of Mr. Ross.',['supervision','supervisor','supervise','supervisory'],'under the supervision of.'],
['Please send your ------- to the HR department.',['application','applicant','apply','applicable'],'Gửi đơn → application.'],
['Customer ------- is our top priority.',['satisfaction','satisfied','satisfy','satisfying'],'Danh từ ghép customer satisfaction.']]},
{id:'g25',c:'Động từ',t:'Động từ nguyên nhân: have, get, make, let, help',s:'have/make/let + O + V nguyên mẫu; get + O + to V; have/get + vật + V3 (nhờ làm).',
f:['have someone do','get someone to do','make someone do (bắt)','let someone do (cho phép)','help (someone) (to) do','have/get something done'],
pts:[['have + người + V.','I\'ll have my assistant send you the file.','Tôi sẽ nhờ trợ lý gửi file cho anh.'],
['get + người + to V.','We got the supplier to lower the price.','Chúng tôi thuyết phục được nhà cung cấp giảm giá.'],

['help + V hoặc to V.','This software helps us reduce errors.','Phần mềm này giúp chúng tôi giảm lỗi.']],
tip:'Vật làm tân ngữ (the car, the report) sau have/get → V3.',
q:[['The manager had the technician ------- the printer.',['repair','to repair','repaired','repairing'],'have + người + V.'],
['We need to get the contract ------- by Friday.',['signed','sign','to sign','signing'],'get + vật + V3.'],
['Ms. Chen let her team ------- early on Friday.',['leave','to leave','left','leaving'],'let + O + V.'],
['The new tool will help us ------- time.',['save','saved','saving','saves'],'help + V.'],
['I\'ll get Mr. Tan ------- you back this afternoon.',['to call','call','called','calls'],'get + người + to V.']]},
{id:'g26',c:'Mệnh đề',t:'Mệnh đề danh từ: that, whether, what, how...',s:'Mệnh đề làm chủ ngữ/tân ngữ. what = the thing that; whether = liệu có hay không.',
f:['that + S + V (rằng)','whether/if + S + V (liệu...)','what + (S) + V (cái mà)','wh-word + S + V (không đảo trợ động từ)'],
pts:[['that.','We confirm that the payment has been received.','Chúng tôi xác nhận đã nhận thanh toán.'],
['whether.','Please let us know whether you can attend.','Vui lòng cho biết liệu anh có thể tham dự không.'],
['what = cái mà (thiếu chủ ngữ/tân ngữ).','What the client needs is a faster schedule.','Điều khách hàng cần là tiến độ nhanh hơn.'],
['Câu hỏi gián tiếp không đảo ngữ.','Could you tell me where the office is?','Anh có thể cho tôi biết văn phòng ở đâu không?']],
tip:'Sau giới từ dùng whether, không dùng if: “depends on whether...”.',
q:[['The decision depends on ------- the budget is approved.',['whether','that','what','if'],'Sau giới từ on → whether.'],
['------- surprised us was the low price.',['What','That','Which','Whether'],'What = the thing that (làm chủ ngữ).'],
['The report shows ------- sales have increased.',['that','what','whether','which'],'show that + mệnh đề đầy đủ.'],
['Could you tell me when the meeting -------?',['starts','does start','does it start','is it starting'],'Câu hỏi gián tiếp không đảo.'],
['We are not sure ------- the shipment will arrive on time.',['whether','what','that','which'],'Không chắc liệu... → whether.']]},
{id:'g27',c:'Câu',t:'Đảo ngữ nhấn mạnh',s:'Trạng từ phủ định/giới hạn đứng đầu câu → đảo trợ động từ lên trước chủ ngữ.',
f:['Rarely / Seldom / Never + trợ động từ + S + V','Only after/when/if + mệnh đề, trợ động từ + S + V','Not until + mốc/mệnh đề + trợ động từ + S + V','No sooner had S V3 than...','Not only + trợ động từ + S + V, but also...','Attached/Enclosed is/are + N (đảo ngữ trong email)'],
pts:[['Rarely.','Rarely does the company miss a deadline.','Hiếm khi công ty trễ hạn.'],
['Only after.','Only after the inspection is complete can we ship the goods.','Chỉ sau khi kiểm tra xong chúng tôi mới có thể giao hàng.'],

q:[['Seldom ------- such a strong demand for steel.',['have we seen','we have seen','we saw','seen we have'],'Seldom đầu câu → đảo.'],
['Only after the payment is received ------- the order.',['will we ship','we will ship','we ship','shipping'],'Only after... → đảo.'],
['Enclosed ------- the documents you requested.',['are','is','be','being'],'Chủ ngữ thật “the documents” số nhiều.'],
['Not until the meeting ended ------- the mistake.',['did she notice','she noticed','she did notice','noticed she'],'Not until → đảo.'],
['Not only ------- the order late, but it was also incomplete.',['was','did','had','it was'],'Not only + đảo (was the order...).']]},
{id:'g28',c:'Từ vựng',t:'Cặp từ dễ nhầm',s:'Các cặp từ gần nghĩa/gần âm xuất hiện nhiều trong Part 5.',
f:['rise (nội động: tăng) / raise (ngoại động: nâng, tăng cái gì)','affect (V: ảnh hưởng) / effect (N: tác động)','between (2) / among (≥3)','lie (nằm) / lay (đặt)','borrow (mượn) / lend (cho mượn)','say (sth) / tell (sb sth)','alternate (luân phiên) / alternative (lựa chọn khác)'],

['between hai bên; among nhiều bên.','The profit was shared among the partners.','Lợi nhuận được chia giữa các đối tác.']],
tip:'Hỏi có tân ngữ không: có → raise/lay/lend; không → rise/lie.',

['The new tax will ------- small businesses.',['affect','effect','effects','affection'],'Động từ → affect.'],
