{id:'g30',c:'Từ loại',t:'Trạng từ đặc biệt: already/yet/still, almost/nearly/hardly, so/such, too/enough',s:'Những trạng từ này hay bị đặt làm phương án nhiễu.',
f:['already (khẳng định), yet (phủ định/nghi vấn, cuối câu), still (vẫn còn)','almost/nearly + all/every/số lượng; hardly = hầu như không','so + adj/adv (+ that); such + (a) + adj + N (+ that)','too + adj (+ to V) = quá; adj + enough (+ to V) = đủ','late (muộn) / lately (gần đây); hard (chăm) / hardly (hầu như không)'],
pts:[['yet ở câu phủ định.','We haven\'t received the payment yet.','Chúng tôi vẫn chưa nhận được thanh toán.'],
['so vs such.','The demand was so high that we added a shift. / It was such a busy month.','Nhu cầu cao đến mức thêm ca. / Đó là một tháng rất bận.'],
['enough đứng sau tính từ.','The room is large enough for 50 people.','Phòng đủ rộng cho 50 người.'],
['hardly = hầu như không.','There is hardly any space left in the warehouse.','Kho hầu như không còn chỗ.']],
tip:'nearly/almost + số lượng (nearly 500 workers); hardly mang nghĩa phủ định — không dùng thêm not.',
q:[['The project is ------- complete; only the painting is left.',['nearly','hardly','near','nearby'],'Gần như hoàn thành.'],
['It was ------- a successful event that we will hold it again.',['such','so','too','very'],'such + a + adj + N.'],
['The warehouse is not big ------- to store all the materials.',['enough','too','so','such'],'adj + enough.'],
['Have you finished the report -------?',['yet','already','still','since'],'Câu hỏi, cuối câu → yet.'],
['The employees have been working very ------- this month.',['hard','hardly','harder than','hardness'],'Chăm chỉ → hard (hardly = hầu như không).']]}
]/*GREND*/;
const P2=/*P2*/[
['When will the shipment arrive in Brisbane?',['It\'s due on the 28th.','By sea freight.','Yes, it arrived.'],'Hỏi When → trả lời thời gian.','Khi nào lô hàng đến Brisbane? – Dự kiến ngày 28.'],
['Who is responsible for the shop drawings?',['Our detailing team in Hanoi.','Yes, they are.','Before Friday.'],'Who → người/bộ phận.','Ai phụ trách bản vẽ gia công? – Đội triển khai ở Hà Nội.'],
['Where should I put these boxes?',['In the storeroom, please.','About ten boxes.','I\'ll put it on.'],'Where → nơi chốn.','Tôi nên để mấy thùng này ở đâu? – Trong phòng kho.'],
['Why was the meeting canceled?',['The manager is sick today.','In Meeting Room B.','At three o\'clock.'],'Why → lý do.','Sao cuộc họp bị hủy? – Trưởng phòng bị ốm.'],
['How long will the inspection take?',['About two hours.','By the inspector.','It was long.'],'How long → khoảng thời gian.','Kiểm tra mất bao lâu? – Khoảng hai giờ.'],
['Would you like me to send the invoice now?',['Yes, that would be great.','No, I didn\'t send it.','It\'s on the invoice.'],'Lời đề nghị → chấp nhận/từ chối.','Anh có muốn tôi gửi hóa đơn ngay không? – Vâng, vậy thì tốt quá.'],
['Didn\'t you receive my email yesterday?',['Sorry, I haven\'t checked my inbox.','Yes, it was sent yesterday.','The email address.'],'Câu hỏi phủ định → trả lời theo sự thật, gián tiếp.','Anh chưa nhận email của tôi hôm qua à? – Xin lỗi, tôi chưa kiểm tra hộp thư.'],
['Should we ship by air or by sea?',['Sea is much cheaper.','Yes, we should.','It\'s on the ship.'],'Câu hỏi lựa chọn → chọn một (không trả lời Yes/No).','Nên gửi đường hàng không hay đường biển? – Đường biển rẻ hơn nhiều.'],
['The crane is booked for Monday, isn\'t it?',['Yes, from 7 a.m.','It\'s a mobile crane.','On the weekend.'],'Câu hỏi đuôi → xác nhận.','Cẩu được đặt cho thứ Hai phải không? – Đúng, từ 7 giờ sáng.'],
['Could you help me move this table?',['Sure, where to?','It\'s a new table.','No, I didn\'t move.'],'Lời nhờ → đồng ý.','Anh giúp tôi chuyển cái bàn này được không? – Được, chuyển đi đâu?'],
['How much does the extra coat of paint cost?',['I\'ll check with the painter.','Three coats.','It\'s blue.'],'Trả lời gián tiếp “để tôi kiểm tra” rất hay đúng.','Lớp sơn thêm giá bao nhiêu? – Tôi sẽ hỏi lại thợ sơn.'],
['Who\'s going to pick up the client at the airport?',['Mr. Lam volunteered.','At gate 5.','The flight is late.'],'Who → người.','Ai sẽ đón khách ở sân bay? – Anh Lâm tình nguyện.'],
['Have the mill certificates been checked?',['Yes, the QC team did it this morning.','Check the mail.','They were certified.'],'Hỏi đã làm chưa → đã làm.','Chứng chỉ xuất xưởng đã được kiểm tra chưa? – Rồi, đội QC làm sáng nay.'],
['Why don\'t we take a short break?',['Good idea, I need a coffee.','Because it broke.','No, it isn\'t short.'],'Why don\'t we = gợi ý → đồng ý.','Sao mình không nghỉ một chút? – Ý hay, tôi cần cà phê.'],
['Where is the nearest bank?',['There\'s one across the street.','I need to withdraw money.','At 9 a.m.'],'Where → nơi chốn.','Ngân hàng gần nhất ở đâu? – Có một cái bên kia đường.'],
['When does the tender close?',['Next Thursday at 2 p.m.','It\'s closed on Sunday.','To the main contractor.'],'When → thời gian.','Khi nào đóng thầu? – Thứ Năm tới lúc 2 giờ chiều.'],
['Which supplier did you choose?',['The one in Hai Phong.','Yes, I chose it.','Supply and delivery.'],'Which → chọn một cái cụ thể.','Anh chọn nhà cung cấp nào? – Nhà cung cấp ở Hải Phòng.'],

['How often do you visit the site?',['Twice a week.','For two weeks.','By car.'],'How often → tần suất.','Anh ra công trường bao lâu một lần? – Hai lần một tuần.'],
['What time does the train to the airport leave?',['Every 15 minutes.','From platform 3.','It takes 30 minutes.'],'Trả lời gián tiếp hợp lý về giờ.','Tàu ra sân bay chạy lúc mấy giờ? – Cứ 15 phút một chuyến.'],
['Do you know who approved this purchase order?',['Ms. Hara signed it.','Yes, I know the order.','It\'s approved by email.'],'Câu hỏi gián tiếp who → người.','Anh có biết ai duyệt đơn hàng này không? – Chị Hara đã ký.'],
['Let\'s discuss the budget after lunch.',['Okay, I\'ll book a room.','I had lunch already.','It\'s over budget.'],'Đề nghị → đồng ý + hành động.','Bàn ngân sách sau bữa trưa nhé. – Được, tôi sẽ đặt phòng.'],
['Aren\'t you going to the trade show?',['No, I have to finish a bid.','Yes, the show was good.','At the convention center.'],'Phủ định → trả lời sự thật + lý do.','Anh không đi hội chợ à? – Không, tôi phải làm xong hồ sơ thầu.'],
['How did the trial assembly go?',['Everything fitted perfectly.','By truck.','At the workshop.'],'How did ... go → kết quả.','Buổi lắp thử thế nào? – Mọi thứ khớp hoàn hảo.'],
['Whose laptop is this?',['I think it\'s Tom\'s.','It\'s a new laptop.','Yes, it is.'],'Whose → của ai.','Laptop này của ai? – Tôi nghĩ của Tom.'],
['Could we get a discount for a larger order?',['Let me ask my manager.','Yes, it\'s large.','The order was placed.'],'Trả lời gián tiếp “để tôi hỏi”.','Đặt nhiều hơn có được giảm giá không? – Để tôi hỏi quản lý.'],
['The printer is out of toner again.',['I\'ll order some more.','Print it in color.','It\'s on the second floor.'],'Phản hồi giải quyết vấn đề.','Máy in lại hết mực. – Tôi sẽ đặt thêm.'],
['Why hasn\'t the container been loaded?',['The truck is stuck in traffic.','Yes, it has.','About 22 tonnes.'],'Why → lý do.','Sao container chưa được xếp hàng? – Xe tải bị kẹt đường.'],
['Would you prefer a window or an aisle seat?',['Either is fine.','Yes, I would.','It\'s a long flight.'],'Lựa chọn → “cái nào cũng được” là đáp án hợp lệ.','Anh muốn ghế cửa sổ hay ghế lối đi? – Cái nào cũng được.']

const P34=/*P34*/{p3:[
{t:'Delivery delay',l:[['W','Hi Mark, this is Linh from the factory. I\'m calling about your order of roof trusses.','Chào Mark, tôi là Linh ở nhà máy. Tôi gọi về đơn hàng dàn mái của anh.'],['M','Oh, hi Linh. Is everything on schedule?','À chào Linh. Mọi thứ đúng tiến độ chứ?'],['W','Unfortunately, the vessel has been delayed by a typhoon. It will now leave Hai Phong on the 12th instead of the 8th.','Tiếc là tàu bị hoãn do bão. Giờ tàu sẽ rời Hải Phòng ngày 12 thay vì ngày 8.'],['M','That\'s a problem. Our crane is booked for the 25th. Can you send the bolts by air so we can at least start the columns?','Vậy thì rắc rối. Cẩu của chúng tôi đã đặt ngày 25. Chị gửi bu lông bằng đường hàng không để ít nhất chúng tôi dựng cột được không?'],['W','Yes, I\'ll ask our forwarder for an air freight quote and email you this afternoon.','Được, tôi sẽ hỏi bên giao nhận báo giá hàng không và email anh chiều nay.']],
q:[['Why is the woman calling?',['To report a shipping delay','To request a payment','To book a crane','To change the order quantity'],'Cô ấy báo tàu bị hoãn.'],['What caused the problem?',['Bad weather','A strike','A mistake in the drawings','A shortage of steel'],'a typhoon = thời tiết xấu.'],['What will the woman do this afternoon?',['Send a price for air freight','Visit the site','Call the crane company','Cancel the order'],'email an air freight quote.']]},
{t:'Hotel booking',l:[['M','Good morning. I\'d like to book a room for three nights, from Monday.','Chào buổi sáng. Tôi muốn đặt phòng ba đêm, từ thứ Hai.'],['W','Certainly. A standard room is 180 dollars per night, and breakfast is included.','Vâng. Phòng tiêu chuẩn 180 đô một đêm, gồm bữa sáng.'],['M','That\'s fine. Is there a shuttle to the airport? My flight leaves early on Thursday.','Được. Có xe đưa đón ra sân bay không? Chuyến bay của tôi đi sớm thứ Năm.'],['W','Yes, the first shuttle leaves at 5 a.m. I\'ll reserve a seat for you. May I have your name, please?','Có, chuyến đầu tiên chạy lúc 5 giờ sáng. Tôi sẽ giữ chỗ cho anh. Cho tôi xin tên ạ?']],
q:[['Where most likely is the woman?',['At a hotel','At an airport','At a restaurant','At a travel agency'],'Đặt phòng → khách sạn.'],['How long will the man stay?',['Three nights','Two nights','One week','Four nights'],'three nights.'],['What will the woman do next?',['Take the man\'s name','Call a taxi','Cancel a flight','Prepare breakfast'],'May I have your name.']]},
{t:'Inspection result',l:[['M','Anna, did you see the inspection report for the columns?','Anna, chị xem biên bản kiểm tra các cột chưa?'],['W','Yes. Two columns failed the dimensional check. The base plates are 5 millimeters out.','Rồi. Hai cột không đạt kiểm tra kích thước. Bản đế lệch 5 mm.'],['M','Can they be fixed before the container is loaded on Friday?','Có sửa kịp trước khi xếp container thứ Sáu không?'],['W','I think so. The workshop says it needs one day. But we should issue an NCR and tell the client first.','Tôi nghĩ là kịp. Xưởng nói cần một ngày. Nhưng ta nên phát hành NCR và báo khách hàng trước.'],['M','Agreed. I\'ll draft the NCR now and you can call the client.','Đồng ý. Tôi soạn NCR ngay, chị gọi khách hàng nhé.']],
q:[['What problem is mentioned?',['Some parts have the wrong size','The paint is damaged','A container is missing','The client canceled the order'],'5 millimeters out = sai kích thước.'],['How long will the repair take?',['One day','One week','Two hours','Five days'],'needs one day.'],['What will the man do?',['Write a report','Call the client','Load the container','Visit the workshop'],'draft the NCR.']]},
{t:'New employee',l:[['W','Hi, I\'m Sara. I started in the purchasing department today.','Chào, tôi là Sara. Hôm nay tôi bắt đầu làm ở phòng mua hàng.'],['M','Welcome, Sara! I\'m Ken from accounting. Have you had your orientation yet?','Chào mừng Sara! Tôi là Ken ở phòng kế toán. Chị đã dự buổi định hướng chưa?'],['W','Not yet. It\'s at two o\'clock, but I don\'t know where the training room is.','Chưa. Lúc 2 giờ, nhưng tôi không biết phòng đào tạo ở đâu.'],['M','It\'s on the fourth floor, next to the elevators. I\'m going up there now. I can show you.','Ở tầng bốn, cạnh thang máy. Tôi đang lên đó, tôi chỉ cho chị.']],
q:[['Who most likely is the woman?',['A new employee','A client','A trainer','An accountant'],'started today.'],['What time is the orientation?',['At 2:00','At 4:00','At 10:00','At 12:00'],'at two o\'clock.'],['What does the man offer to do?',['Show the woman the way','Lend her a laptop','Call the trainer','Change the schedule'],'I can show you.']]},
{t:'Price negotiation',l:[['M','We\'ve reviewed your quotation. The quality looks good, but the price is about 8 percent above our budget.','Chúng tôi đã xem báo giá. Chất lượng tốt nhưng giá cao hơn ngân sách khoảng 8%.'],['W','I understand. If you could accept 40 percent advance payment instead of 20, we could reduce the price by 3 percent.','Tôi hiểu. Nếu anh chấp nhận tạm ứng 40% thay vì 20%, chúng tôi có thể giảm giá 3%.'],['M','That helps. What about delivery? Could you deliver in two batches?','Như vậy có đỡ. Còn giao hàng thì sao? Chị giao làm hai đợt được không?'],['W','Yes, partial shipments are no problem. I\'ll send a revised offer by tomorrow.','Được, giao từng phần không vấn đề gì. Tôi sẽ gửi chào giá sửa đổi trước ngày mai.']],
q:[['What is the man\'s concern?',['The price is too high','The quality is poor','The delivery is late','The drawings are wrong'],'8% above budget.'],['What does the woman propose?',['A larger advance payment for a lower price','A different supplier','A longer warranty','Free delivery'],'40% advance → giảm 3%.'],['What will the woman send?',['An updated offer','A sample','A contract','An invoice'],'revised offer.']]},
{t:'Printer problem',l:[['W','Excuse me, the copier on this floor isn\'t working. It keeps saying \'paper jam\'.','Xin lỗi, máy photo tầng này không chạy. Nó cứ báo kẹt giấy.'],['M','I checked it this morning. A part is broken, and the technician can\'t come until Thursday.','Tôi đã kiểm tra sáng nay. Một bộ phận bị hỏng và thợ không đến được trước thứ Năm.'],['W','But I need to print 30 copies of the tender documents today.','Nhưng hôm nay tôi cần in 30 bộ hồ sơ thầu.'],['M','You can use the one on the third floor. Just enter your department code.','Chị có thể dùng máy ở tầng ba. Chỉ cần nhập mã phòng ban.']],
q:[['What is the problem?',['A machine is broken','A document is missing','A meeting is late','A code is wrong'],'copier isn\'t working.'],['When will the technician come?',['On Thursday','Today','Tomorrow morning','Next week'],'until Thursday.'],['What does the man suggest?',['Using another copier','Calling the technician again','Printing fewer copies','Sending the files by email'],'the one on the third floor.']]}
],
p4:[
{t:'Airport announcement',k:'Thông báo',l:[['W','Attention, passengers on Flight VN 781 to Sydney.','Hành khách chuyến bay VN 781 đi Sydney chú ý.'],['W','Due to a technical problem, the departure has been delayed by about 90 minutes.','Do sự cố kỹ thuật, giờ khởi hành bị hoãn khoảng 90 phút.'],['W','The new boarding time is 11:30, and the flight will now leave from Gate 24.','Giờ lên máy bay mới là 11:30 và chuyến bay sẽ khởi hành từ cửa 24.'],['W','Passengers may collect a meal voucher at the service desk near Gate 20. We apologize for the inconvenience.','Hành khách có thể nhận phiếu ăn tại quầy dịch vụ gần cửa 20. Chúng tôi xin lỗi vì sự bất tiện.']],
q:[['What is the reason for the delay?',['A technical problem','Bad weather','A late crew','Heavy traffic'],'technical problem.'],['What has changed besides the time?',['The gate','The destination','The airline','The ticket price'],'Gate 24.'],['What can passengers get?',['A meal voucher','A hotel room','A refund','A free upgrade'],'meal voucher.']]},
{t:'Safety briefing',k:'Hướng dẫn an toàn',l:[['M','Good morning, everyone, and welcome to the site.','Chào buổi sáng mọi người, chào mừng đến công trường.'],['M','Before you start work, you must complete this induction and sign the attendance sheet.','Trước khi làm việc, các bạn phải hoàn thành buổi hướng dẫn này và ký danh sách tham dự.'],['M','Hard hats, safety boots and high-visibility vests must be worn at all times.','Phải luôn đội mũ cứng, mang giày bảo hộ và áo phản quang.'],['M','Today the crane will lift the roof trusses, so the area around grid line C is an exclusion zone from 9 a.m. to noon.','Hôm nay cẩu sẽ nâng các dàn mái, nên khu vực quanh trục C là vùng cấm từ 9 giờ đến trưa.'],['M','If you see anything unsafe, report it to me or to the site office immediately.','Nếu thấy điều gì không an toàn, báo ngay cho tôi hoặc văn phòng công trường.']],
q:[['Who most likely is the speaker?',['A site supervisor','A hotel manager','A tour guide','A sales clerk'],'Hướng dẫn công trường.'],['What must listeners do before starting work?',['Sign a form','Watch a video','Pay a fee','Take a test'],'sign the attendance sheet.'],['Why is an area closed this morning?',['A lifting operation','A delivery of concrete','An inspection','Painting work'],'crane will lift the roof trusses.']]},
{t:'Voicemail from supplier',k:'Tin nhắn thoại',l:[['W','Hello, this is Emma Clarke from Pacific Bolts calling for Mr. Nguyen.','Xin chào, tôi là Emma Clarke ở Pacific Bolts gọi cho anh Nguyễn.'],['W','I\'m calling about your order of high-strength bolts.','Tôi gọi về đơn hàng bu lông cường độ cao của anh.'],['W','The M24 bolts are in stock, but the M30 size will take another two weeks.','Bu lông M24 có sẵn, nhưng cỡ M30 phải chờ thêm hai tuần.'],['W','We can send the M24 bolts today if you agree to a partial delivery.','Chúng tôi có thể gửi M24 hôm nay nếu anh đồng ý giao từng phần.'],['W','Please call me back at 555-0182 before 4 p.m. so we can arrange the truck.','Vui lòng gọi lại số 555-0182 trước 4 giờ chiều để chúng tôi sắp xe.']],
q:[['What is the purpose of the call?',['To discuss an order','To make a complaint','To offer a job','To confirm a meeting'],'about your order.'],['What problem does the speaker mention?',['One size is not available yet','The price has increased','The truck broke down','The order was lost'],'M30 will take two more weeks.'],['What is the listener asked to do?',['Return the call before 4 p.m.','Send an email','Pay in advance','Visit the warehouse'],'call me back before 4 p.m.']]},
{t:'Company news',k:'Tin nội bộ',l:[['M','In company news this week, we are pleased to announce that our firm has won the contract for the new stadium roof in Queensland.','Tin công ty tuần này: chúng tôi vui mừng thông báo đã thắng hợp đồng mái sân vận động mới ở Queensland.'],['M','The project includes about 1,200 tonnes of structural steel.','Dự án gồm khoảng 1.200 tấn thép kết cấu.'],['M','To meet the schedule, the factory will add a second shift starting next month, and we will be hiring 40 additional welders.','Để kịp tiến độ, nhà máy sẽ thêm ca hai từ tháng tới và tuyển thêm 40 thợ hàn.'],['M','Employees who know qualified welders are encouraged to refer them to the HR department. A referral bonus will be paid.','Nhân viên biết thợ hàn có chứng chỉ được khuyến khích giới thiệu cho phòng nhân sự. Sẽ có thưởng giới thiệu.']],
q:[['What is being announced?',['A new contract','A new office','A merger','A product launch'],'won the contract.'],['What will the factory do next month?',['Add a work shift','Close for repairs','Move to a new location','Buy a new crane'],'add a second shift.'],['What are employees encouraged to do?',['Recommend job candidates','Work overtime','Attend a training course','Visit the stadium'],'refer qualified welders.']]},
{t:'Tour of the factory',k:'Hướng dẫn tham quan',l:[['W','Welcome to our fabrication plant. My name is Mai, and I\'ll be your guide this morning.','Chào mừng quý vị đến nhà máy chế tạo. Tôi là Mai, hướng dẫn viên sáng nay.'],['W','We\'ll start in the cutting area, where plates are cut by CNC machines.','Chúng ta bắt đầu ở khu cắt, nơi thép tấm được cắt bằng máy CNC.'],['W','Then we\'ll visit the welding bays and the blasting and painting line.','Sau đó tham quan khu hàn và dây chuyền phun làm sạch và sơn.'],['W','Please stay on the green walkway and keep your safety glasses on.','Vui lòng đi trên lối đi màu xanh và luôn đeo kính bảo hộ.'],['W','The tour will take about one hour, and afterward lunch will be served in the meeting room.','Chuyến tham quan khoảng một giờ, sau đó bữa trưa được phục vụ ở phòng họp.']],
q:[['Where does the talk take place?',['At a factory','At a museum','At a port','At an airport'],'fabrication plant.'],['What are listeners asked to do?',['Stay on a marked path','Take photographs','Sign a contract','Turn off their phones'],'stay on the green walkway.'],['What will happen after the tour?',['A meal will be served','A video will be shown','A test will be given','A bus will arrive'],'lunch will be served.']]},
{t:'Radio traffic report',k:'Bản tin giao thông',l:[['M','And now for the traffic report.','Và bây giờ là bản tin giao thông.'],['M','Highway 1 northbound is very slow this morning because of road works near the Riverside Bridge.','Sáng nay Quốc lộ 1 hướng bắc rất chậm do thi công gần cầu Riverside.'],['M','One lane will be closed until Friday, so drivers should expect delays of up to 30 minutes.','Một làn sẽ bị đóng đến thứ Sáu, vì vậy tài xế nên dự tính chậm đến 30 phút.'],['M','If possible, use Park Road instead, or take the new express bus, which runs every ten minutes.','Nếu có thể, hãy đi đường Park hoặc đi xe buýt nhanh mới, chạy mỗi mười phút.'],['M','Next, we\'ll have the weather forecast.','Tiếp theo là dự báo thời tiết.']],
q:[['What is causing the delay?',['Road construction','An accident','Snow','A parade'],'road works.'],['Until when will the lane be closed?',['Friday','Tonight','Next month','Monday'],'until Friday.'],['What will listeners hear next?',['A weather forecast','A news interview','Music','An advertisement'],'weather forecast.']]}
]}/*P34END*/;

{t:'Email: Delivery schedule',text:'Dear Mr. Harris,\n\nThank you for your purchase order No. 4471 for the warehouse steel structure. We are pleased to confirm that production [1] on 3 March.\n\nThe structure will be delivered in three shipments. The first shipment, [2] includes all columns and anchor bolts, will leave Hai Phong on 15 April. [3]\n\nPlease note that the delivery dates depend on the approval of the shop drawings. [4], we kindly ask you to return the approved drawings by 20 February.\n\nBest regards,\nLinh Tran',

{t:'Notice: Office renovation',text:'To all staff:\n\nThe third floor of our office will be [1] from 5 to 16 May. During this period, the accounting and purchasing departments will [2] to temporary desks on the first floor.\n\n[3] Staff are asked to pack their personal items by Friday, 2 May. Boxes will be provided by the facilities team.\n\nWe apologize for the [4] and thank you for your cooperation.\n\nFacilities Management',

{t:'Advertisement: Training course',text:'Improve Your Business English!\n\nOur eight-week course is designed for engineers and managers [1] work with international clients. Classes are held every Tuesday and Thursday evening.\n\nParticipants will learn how to write clear emails, run meetings and negotiate [2]. [3]\n\nThe course fee is $350, but companies that register five or more employees will receive a 10% [4].\n\nTo register, visit www.bizenglish.example.',

{t:'Memo: New safety rule',text:'MEMO\nTo: All workshop staff\nFrom: HSE Manager\n\nEffective 1 June, all staff working at heights above 2 meters [1] wear a full-body harness. This rule applies to both employees and [2].\n\nHarnesses can be collected from the tool store. [3] Damaged equipment must be reported immediately.\n\nSupervisors are responsible for [4] that the rule is followed.',

{t:'Press release: New plant',text:'HCMC – Dai Viet Steel announced today that it will open a new fabrication plant in Long An Province next year. The plant will [1] the company\'s annual capacity to 60,000 tonnes.\n\n"Demand from Australia and Canada has grown [2] over the past three years," said CEO Nguyen Hoang. [3]\n\nConstruction of the plant will begin in January, and about 400 new jobs are expected to be [4].',

p7:[
{t:'Email',text:'From: kenji.sato@kume-example.jp\nTo: tay.nguyen@ddc-example.vn\nSubject: Factory audit\n\nDear Mr. Nguyen,\n\nThank you for sending the quality manual. Our team would like to visit your factory to carry out a supplier audit before we award the contract for the Osaka stadium roof.\n\nWe propose to visit on 12 or 13 March. The audit will take one full day and will cover welding procedures, welder qualifications and the painting line. We would also like to see a trial assembly if one is scheduled during that week.\n\nPlease confirm which date is convenient and send us the name of a contact person who can meet us at the airport.\n\nBest regards,\nKenji Sato\nProcurement Manager',
q:[['What is the purpose of the email?',['To arrange a factory visit','To award a contract','To complain about quality','To order steel'],'carry out a supplier audit.'],['What is NOT mentioned as part of the audit?',['Packing for shipment','Welding procedures','Welder qualifications','The painting line'],'Packing không được nhắc.'],['What does Mr. Sato ask Mr. Nguyen to do?',['Confirm a date and name a contact','Send a price quotation','Book a hotel','Prepare a contract'],'confirm which date ... send the name of a contact person.'],['What does Mr. Sato want to see if possible?',['A trial assembly','The company\'s accounts','A new crane','The office building'],'see a trial assembly if one is scheduled.']]},
{t:'Advertisement',text:'JOB OPENING – QC Engineer (Export Projects)\n\nWe are a leading steel fabricator exporting to Japan, Australia and Canada.\n\nResponsibilities:\n- Prepare and follow Inspection and Test Plans (ITPs)\n- Witness NDT and dimensional checks\n- Communicate with clients\' inspectors in English\n\nRequirements:\n- Degree in mechanical or civil engineering\n- At least 3 years of QC experience in steel structures\n- TOEIC 650 or above; Japanese is an advantage\n\nWe offer a competitive salary, health insurance and overseas training.\nSend your résumé to hr@example.vn by 31 January.',
q:[['What is being advertised?',['A job','A training course','A product','A factory tour'],'JOB OPENING.'],['What is required for the position?',['Three years of experience','A Japanese certificate','Experience in Canada','A master\'s degree'],'At least 3 years.'],['What is suggested about the company?',['It works with foreign clients','It is a new company','It only sells in Vietnam','It is closing soon'],'exporting to Japan, Australia and Canada.']]},
{t:'Text message chain',text:'[9:12] Minh: The container truck just arrived at the factory. The driver says he must leave by 1 p.m.\n[9:14] Lisa: Are all bundles ready?\n[9:15] Minh: Bundles 1–6 yes. Bundle 7 is still being painted.\n[9:16] Lisa: How long will it take to dry?\n[9:18] Minh: About three hours.\n[9:19] Lisa: That\'s too late. Load 1–6 now and we\'ll send bundle 7 with the next shipment.\n[9:20] Minh: Got it. I\'ll update the packing list.',
q:[['Why is Minh writing to Lisa?',['A truck is waiting to be loaded','A bundle was damaged','The driver is late','The paint has run out'],'container truck arrived.'],['At 9:19, what does Lisa mean when she writes "That\'s too late"?',['The bundle will not be ready before the truck leaves','The truck arrived too late','The painting started late','The shipment has been canceled'],'Sơn khô mất 3 giờ, xe phải đi lúc 1 giờ.'],['What will Minh do next?',['Revise a document','Call the driver','Paint bundle 7','Cancel the shipment'],'update the packing list.']]},
{t:'Notice',text:'RIVERSIDE BUSINESS CENTER\nNotice to all tenants\n\nThe main elevators will be out of service on Saturday, 14 June, from 8 a.m. to 6 p.m. for scheduled maintenance. During this time, please use the service elevator at the back of the building.\n\nThe parking garage will remain open as usual. However, the east entrance will be closed, so vehicles must enter from Park Street.\n\nWe apologize for any inconvenience. For questions, contact the building office at extension 100.',
q:[['Why will the elevators be out of service?',['For maintenance','Because of a power cut','For a fire drill','Because of a strike'],'scheduled maintenance.'],['What are tenants asked to use on 14 June?',['The service elevator','The stairs only','The east entrance','A shuttle bus'],'use the service elevator.'],['What is indicated about the parking garage?',['One entrance will be closed','It will be closed all day','Parking will be free','It will open later than usual'],'the east entrance will be closed.']]},
{t:'Article',text:'Steel Fabricators Look Abroad\n\nVietnamese steel fabricators are winning more contracts overseas. According to industry data, exports of fabricated steel structures rose by about one third last year, with Australia, Japan and Canada among the main markets.\n\nCompanies say the key to success is quality, not just price. "Clients in Japan expect every weld and every document to be perfect," said one project manager. Many firms have invested in automated cutting lines and trained their staff in international welding standards.\n\nHowever, rising sea freight costs remain a challenge. Some fabricators now design members in shorter lengths so that more steel can fit into standard containers.',
q:[['What is the article mainly about?',['The growth of steel exports','The price of steel in Vietnam','A new welding standard','Problems with containers in Japan'],'Fabricators look abroad.'],['According to the article, what do Japanese clients expect?',['Very high quality','Low prices only','Fast delivery by air','Local suppliers'],'every weld and every document to be perfect.'],['What challenge is mentioned?',['Higher shipping costs','A lack of welders','New taxes','Bad weather'],'rising sea freight costs.'],['The word "key" in paragraph 2 is closest in meaning to',['most important factor','tool for a lock','answer','price'],'key to success = yếu tố quan trọng nhất.']]},
{t:'Online form',text:'TRADE SHOW REGISTRATION – Steel Build Expo, Sydney, 8–10 October\n\nName: Tay Nguyen\nCompany: Dai Dung Group\nType of pass: Exhibitor (3 days)\nBooth size: 3 m x 6 m (Hall B, No. B-214)\nAdditional services: Electricity (yes), Internet (yes), Furniture package (no)\nPayment: Paid in full on 2 July\n\nNote: Exhibitors may begin setting up their booths on 7 October from 1 p.m. All booths must be ready by 8 a.m. on 8 October.',
q:[['What kind of pass did Mr. Nguyen register for?',['Exhibitor','Visitor','Speaker','Press'],'Exhibitor (3 days).'],['What service did he NOT request?',['Furniture','Electricity','Internet','A booth'],'Furniture package (no).'],['When can he start preparing his booth?',['7 October in the afternoon','8 October at 8 a.m.','2 July','10 October']
,'7 October from 1 p.m.']]}

const DL=/*DL*/[{"id":"au-1","g":"AU","t":"Cuộc gọi đầu tiên với khách Úc","s":"Giới thiệu công ty với một nhà thầu ở Brisbane.","a":"Tay (DDC)","b":"Mark (Builder)","l":[["A","Good morning, Mark. This is Tay Nguyen from Dai Dung Group in Vietnam. Is this a good time to talk?","Chào buổi sáng Mark. Tôi là Tây Nguyễn ở tập đoàn Đại Dũng, Việt Nam. Giờ anh tiện nói chuyện không?"],["B","Morning, Tay. Yes, I've got about ten minutes.","Chào Tây. Được, tôi có khoảng mười phút."],["A","Thanks. I'm calling because we saw your tender for the Barlow Park stadium upgrade. We fabricate structural steel for export, mainly to Australia, Japan and Canada.","Cảm ơn anh. Tôi gọi vì chúng tôi thấy gói thầu nâng cấp sân vận động Barlow Park. Chúng tôi chế tạo kết cấu thép xuất khẩu, chủ yếu sang Úc, Nhật và Canada."],["B","Right. Have you worked to Australian standards before?","Ừ. Bên anh đã làm theo tiêu chuẩn Úc chưa?"],["A","Yes. Our welding procedures are qualified to AS/NZS 1554.1, and we've supplied several projects in Queensland.","Rồi. Quy trình hàn của chúng tôi đã được kiểm định theo AS/NZS 1554.1, và chúng tôi đã cung cấp cho vài dự án ở Queensland."],["B","Good. Can you send me your company profile and a list of reference projects?","Tốt. Anh gửi tôi hồ sơ năng lực và danh sách dự án tham chiếu được không?"],["A","Of course. I'll email them today, together with our ISO certificates.","Tất nhiên. Tôi sẽ email hôm nay, kèm chứng chỉ ISO."],["B","Great. I'll pass them on to our procurement team.","Tuyệt. Tôi sẽ chuyển cho đội mua hàng."]]},{"id":"au-2","g":"AU","t":"Hỏi rõ phạm vi báo giá","s":"Làm rõ phạm vi trước khi báo giá.","a":"Tay","b":"Sarah (Estimator)","l":[["A","Hi Sarah, before we finalize our price, I'd like to confirm the scope.","Chào Sarah, trước khi chốt giá, tôi muốn xác nhận phạm vi."],["B","Sure. What do you need to know?","Được. Anh cần biết gì?"],["A","Is painting included, or will the steel be hot-dip galvanized?","Có gồm sơn không, hay thép sẽ mạ kẽm nhúng nóng?"],["B","External steel is galvanized. Internal steel gets a two-coat paint system.","Thép bên ngoài mạ kẽm. Thép bên trong sơn hệ hai lớp."],["A","Understood. And are the anchor bolts in our scope?","Đã hiểu. Còn bu lông neo có thuộc phạm vi của chúng tôi không?"],["B","Yes, please supply them with templates, but we'll install them on site.","Có, vui lòng cung cấp kèm dưỡng, nhưng chúng tôi sẽ lắp tại công trường."],["A","And the delivery term—FOB Vietnam or CIF Brisbane?","Còn điều kiện giao hàng—FOB Việt Nam hay CIF Brisbane?"],["B","Please quote both. We'll decide after comparing.","Vui lòng báo cả hai. Chúng tôi sẽ quyết định sau khi so sánh."]]},{"id":"au-3","g":"AU","t":"Nộp RFI về bản vẽ","s":"Bản vẽ thiếu chi tiết liên kết.","a":"Tay","b":"David (Engineer)","l":[["A","David, we've found a few issues on the design drawings. I've sent RFI number 7 this morning.","David, chúng tôi phát hiện vài vấn đề trên bản vẽ thiết kế. Sáng nay tôi đã gửi RFI số 7."],["B","Thanks. What's the main problem?","Cảm ơn. Vấn đề chính là gì?"],["A","The connection detail for the rafter splice is missing, and the bolt grade isn't specified.","Chi tiết liên kết mối nối kèo bị thiếu, và chưa ghi cấp bền bu lông."],["B","Use 8.8/S bolts, fully tensioned. I'll send a sketch for the splice.","Dùng bu lông 8.8/S, xiết căng hoàn toàn. Tôi sẽ gửi phác thảo cho mối nối."],["A","When can we expect your reply? We need it to finish the shop drawings.","Khi nào chúng tôi nhận được trả lời? Chúng tôi cần để hoàn thành bản vẽ gia công."],["B","By Wednesday at the latest.","Muộn nhất là thứ Tư."],["A","Perfect. Should we hold those members until then?","Tốt quá. Chúng tôi có nên tạm dừng các cấu kiện đó đến lúc ấy không?"],["B","Yes, please put them on hold. Carry on with the columns.","Có, tạm dừng chúng. Cứ tiếp tục làm các cột."]]},{"id":"au-4","g":"AU","t":"Báo chậm tiến độ","s":"Thông báo trễ do chờ thép tấm.","a":"Tay","b":"Mark","l":[["A","Mark, I'm afraid I have some bad news about the delivery.","Mark, tôi e là có tin không tốt về giao hàng."],["B","Go on.","Anh nói đi."],["A","Our 40 mm plate from the mill is late, so the base plates will be about one week behind.","Thép tấm 40 mm từ nhà máy bị trễ, nên bản đế sẽ chậm khoảng một tuần."],["B","That affects our erection start. Is there any way to recover the time?","Việc đó ảnh hưởng ngày bắt đầu lắp dựng. Có cách nào bù thời gian không?"],["A","We can run overtime on welding and ship the columns first. The base plates could follow by air.","Chúng tôi có thể tăng ca hàn và giao cột trước. Bản đế có thể gửi theo bằng đường hàng không."],["B","Who pays for the air freight?","Ai trả cước hàng không?"],["A","Since the delay is on our side, we'll cover it.","Vì chậm trễ do phía chúng tôi, chúng tôi sẽ chịu."],["B","Okay. Send me a revised schedule today, please.","Được. Vui lòng gửi tôi tiến độ điều chỉnh trong hôm nay."]]},{"id":"au-5","g":"AU","t":"Chứng kiến thử nghiệm qua video","s":"Khách không sang được, chứng kiến UT qua video.","a":"Tay","b":"Paul (Client QA)","l":[["A","Paul, the ultrasonic testing on the main girders is scheduled for Thursday. Will you attend?","Paul, siêu âm dầm chính dự kiến thứ Năm. Anh có tham dự không?"],["B","I can't travel this month. Could we do it by video call?","Tháng này tôi không đi được. Mình làm qua video call được không?"],["A","Sure. Our inspector can share the screen of the UT machine and show the welds with a camera.","Được. Thanh tra của chúng tôi có thể chia sẻ màn hình máy siêu âm và quay các mối hàn."],["B","That works. Please also send the reports within 24 hours.","Vậy được. Vui lòng gửi biên bản trong vòng 24 giờ."],["A","Will do. What time suits you, considering the time difference?","Chắc chắn. Giờ nào phù hợp với anh, tính cả chênh lệch múi giờ?"],["B","How about 11 a.m. Brisbane time? That's 8 a.m. in Vietnam.","11 giờ sáng giờ Brisbane được không? Tức 8 giờ sáng ở Việt Nam."],["A","Perfect. I'll send a meeting invitation.","Tốt. Tôi sẽ gửi lời mời họp."]]},{"id":"au-6","g":"AU","t":"Xử lý hàng hư khi tới công trường","s":"Lớp mạ bị trầy khi dỡ hàng.","a":"Mark","b":"Tay","l":[["A","Tay, we unloaded the first container. A few galvanized beams have scratches.","Tây, chúng tôi đã dỡ container đầu. Vài dầm mạ kẽm bị trầy."],["B","I'm sorry to hear that. Could you send photos and the mark numbers?","Tôi rất tiếc. Anh gửi ảnh và mã cấu kiện được không?"],["A","Sure. Most are small, but one is about 30 centimeters long.","Được. Phần lớn nhỏ, nhưng một chỗ dài khoảng 30 cm."],["B","Small areas can be repaired with zinc-rich paint according to the standard. We'll send the touch-up paint and a procedure.","Vùng nhỏ có thể sửa bằng sơn giàu kẽm theo tiêu chuẩn. Chúng tôi sẽ gửi sơn dặm và quy trình."],["A","And the long one?","Còn chỗ dài?"],["B","Let me check with our QC manager. If needed, we'll pay a local galvanizer to fix it.","Để tôi hỏi trưởng QC. Nếu cần, chúng tôi trả tiền cho đơn vị mạ địa phương sửa."],["A","Okay. Also, please improve the packing for the next shipments.","Được. Ngoài ra, vui lòng cải thiện đóng gói cho các chuyến sau."],["B","Definitely. We'll add rubber pads between the layers.","Chắc chắn. Chúng tôi sẽ thêm đệm cao su giữa các lớp."]]},{"id":"au-7","g":"AU","t":"Đàm phán phát sinh","s":"Khách thêm giằng, bàn giá phát sinh.","a":"Sarah","b":"Tay","l":[["A","Tay, the engineer added extra bracing in bays 4 to 6. Can you include it in the current shipment?","Tây, kỹ sư thêm giằng ở nhịp 4 đến 6. Bên anh đưa vào chuyến hàng hiện tại được không?"],["B","We can, but it's outside the original scope. I'll need to issue a variation.","Được, nhưng ngoài phạm vi ban đầu. Tôi cần phát hành phát sinh."],["A","How much are we talking about?","Khoảng bao nhiêu?"],["B","It's about 6 tonnes. At our contract rate, that's around 13,000 dollars, plus air freight if you need it urgently.","Khoảng 6 tấn. Theo đơn giá hợp đồng, khoảng 13.000 đô, cộng cước hàng không nếu cần gấp."],["A","Sea freight is fine. Can you hold the contract rate?","Đường biển là được. Anh giữ đơn giá hợp đồng chứ?"],["B","Yes, as long as we receive the approved drawings this week.","Có, miễn là chúng tôi nhận bản vẽ duyệt trong tuần này."],["A","Deal. Please send the variation for signature.","Đồng ý. Gửi phát sinh để ký nhé."]]},{"id":"au-8","g":"AU","t":"Kết thúc dự án & xin đánh giá","s":"Sau bàn giao, xin thư giới thiệu.","a":"Tay","b":"Mark","l":[["A","Mark, now that the roof is complete, I wanted to thank you for working with us.","Mark, giờ mái đã xong, tôi muốn cảm ơn anh đã hợp tác với chúng tôi."],["B","Thanks, Tay. Your team did a solid job, especially with the trial assembly.","Cảm ơn Tây. Đội anh làm tốt, nhất là phần lắp thử."],["A","That's great to hear. Would you be willing to give us a reference letter?","Rất vui khi nghe vậy. Anh có sẵn lòng viết thư giới thiệu cho chúng tôi không?"],["B","Sure. I'll ask our project director to sign it.","Được. Tôi sẽ nhờ giám đốc dự án ký."],["A","Thank you. Also, is there anything we could have done better?","Cảm ơn. Ngoài ra, có điều gì chúng tôi có thể làm tốt hơn không?"],["B","Communication on the delay could have been earlier. Otherwise, very good.","Thông báo về sự chậm trễ lẽ ra nên sớm hơn. Ngoài ra thì rất tốt."],["A","Noted. We'll improve that on the next project.","Đã ghi nhận. Chúng tôi sẽ cải thiện ở dự án tới."]]},{"id":"ca-1","g":"CA","t":"Gọi cho kỹ sư Canada về CSA","s":"Xác nhận tiêu chuẩn hàn Canada.","a":"Tay","b":"Emily (Engineer, Vancouver)","l":[["A","Hi Emily, thanks for joining the call. I'd like to check the welding requirements.","Chào Emily, cảm ơn chị tham gia cuộc gọi. Tôi muốn kiểm tra yêu cầu về hàn."],["B","Of course. The project follows CSA W59, and the fabricator must be certified to CSA W47.1.","Được. Dự án theo CSA W59, và đơn vị chế tạo phải có chứng nhận CSA W47.1."],["A","We're currently certified to AS/NZS and JIS. How long does W47.1 certification take?","Hiện chúng tôi có chứng nhận AS/NZS và JIS. Chứng nhận W47.1 mất bao lâu?"],["B","Usually two to three months, including an audit by CWB.","Thường hai đến ba tháng, gồm buổi đánh giá của CWB."],["A","Could we start fabrication of non-welded parts while waiting?","Chúng tôi có thể chế tạo các chi tiết không hàn trong lúc chờ không?"],["B","Cutting and drilling are fine, but no structural welding until you're certified.","Cắt và khoan thì được, nhưng không hàn kết cấu cho đến khi được chứng nhận."],["A","Understood. I'll contact CWB this week.","Đã hiểu. Tôi sẽ liên hệ CWB tuần này."]]},{"id":"ca-2","g":"CA","t":"Thép cho thời tiết lạnh","s":"Hỏi yêu cầu thép chịu nhiệt độ thấp.","a":"Tay","b":"Emily","l":[["A","Emily, the spec mentions Category 3 for some members. What does that mean for the material?","Emily, tiêu chuẩn kỹ thuật ghi Category 3 cho một số cấu kiện. Điều đó có nghĩa gì với vật liệu?"],["B","It means impact-tested steel. The site is in Alberta, and winter temperatures can reach minus 40.","Nghĩa là thép có thử va đập. Công trường ở Alberta, mùa đông có thể xuống âm 40 độ."],["A","So we need Charpy testing at a specific temperature?","Vậy chúng tôi cần thử Charpy ở nhiệt độ cụ thể?"],["B","Yes, CSA G40.21 350WT, Category 3, tested at minus 30.","Đúng, CSA G40.21 350WT, Category 3, thử ở âm 30 độ."],["A","That plate isn't common in Asia. Can we propose an equivalent?","Loại tấm đó không phổ biến ở châu Á. Chúng tôi đề xuất loại tương đương được không?"],["B","You can, but send the chemical and mechanical properties for approval first.","Được, nhưng gửi thành phần hóa học và cơ tính để duyệt trước."],["A","Will do. I'll prepare a comparison table.","Chắc chắn. Tôi sẽ chuẩn bị bảng so sánh."]]},{"id":"ca-3","g":"CA","t":"Hỏi về cỡ vận chuyển ra Vancouver","s":"Bàn chiều dài cấu kiện để vừa container.","a":"Tay","b":"Ryan (Logistics)","l":[["A","Ryan, our longest rafters are 16 meters. Can your trucks handle that in Vancouver?","Ryan, kèo dài nhất của chúng tôi là 16 m. Xe tải bên anh ở Vancouver chở được không?"],["B","We can, but it's easier if everything fits in 40-foot containers. That's about 12 meters.","Được, nhưng sẽ dễ hơn nếu mọi thứ vừa container 40 feet. Khoảng 12 m."],["A","Then we'd need a bolted splice. The engineer must approve that.","Vậy cần mối nối bu lông. Kỹ sư phải duyệt."],["B","Right. Otherwise you'd need flat racks, and they're expensive right now.","Đúng. Nếu không thì phải dùng flat rack, mà giá hiện đang đắt."],["A","I'll compare the cost of the splices with the flat rack freight.","Tôi sẽ so sánh chi phí mối nối với cước flat rack."],["B","Good idea. Send me the numbers and I'll check with the port.","Ý hay. Gửi tôi số liệu, tôi sẽ hỏi cảng."]]},{"id":"ca-4","g":"CA","t":"Họp tiến độ hằng tuần","s":"Họp online với tổng thầu Canada.","a":"Emily","b":"Tay","l":[["A","Let's start with the fabrication status. Where are we, Tay?","Bắt đầu với tình trạng chế tạo. Tiến độ thế nào rồi Tây?"],["B","Columns are 100 percent fabricated, beams are at 70 percent, and bracing will start next week.","Cột đã chế tạo 100%, dầm 70%, giằng sẽ bắt đầu tuần tới."],["A","And painting?","Còn sơn?"],["B","About half of the columns are painted. The rest will be done by the 20th.","Khoảng nửa số cột đã sơn. Phần còn lại xong trước ngày 20."],["A","Any risks we should know about?","Có rủi ro nào chúng tôi cần biết không?"],["B","The vessel space in December is tight because of the holiday season. We've booked early to be safe.","Chỗ trên tàu tháng 12 khan hiếm vì mùa lễ. Chúng tôi đã đặt sớm cho chắc."],["A","Good thinking. Please send the photos with the weekly report.","Tốt. Vui lòng gửi ảnh kèm báo cáo tuần."]]},{"id":"ca-5","g":"CA","t":"Hỏi về điều khoản thanh toán","s":"Thảo luận L/C và tạm ứng.","a":"Tay","b":"Michael (Purchasing)","l":[["A","Michael, regarding payment terms, we normally ask for 30 percent in advance.","Michael, về điều khoản thanh toán, chúng tôi thường yêu cầu tạm ứng 30%."],["B","Our company policy is to pay 10 percent in advance, with a bank guarantee.","Chính sách công ty tôi là tạm ứng 10% kèm bảo lãnh ngân hàng."],["A","I see. Could we meet in the middle—20 percent advance, and the balance by letter of credit at sight?","Tôi hiểu. Mình chia đôi được không—tạm ứng 20%, phần còn lại bằng L/C trả ngay?"],["B","An L/C is possible. Let me discuss the 20 percent with our finance team.","L/C thì được. Để tôi bàn mức 20% với phòng tài chính."],["A","Thank you. If it helps, we can provide an advance payment guarantee from our bank.","Cảm ơn. Nếu có ích, chúng tôi có thể cung cấp bảo lãnh tạm ứng từ ngân hàng."],["B","That should make it easier to approve. I'll get back to you by Friday.","Điều đó sẽ giúp dễ duyệt hơn. Tôi sẽ phản hồi trước thứ Sáu."]]},{"id":"ca-6","g":"CA","t":"Sự cố chênh lệch số lượng","s":"Khách báo thiếu bu lông.","a":"Ryan","b":"Tay","l":[["A","Tay, we counted the bolts on site. We're short about 200 M20 bolts.","Tây, chúng tôi đếm bu lông ở công trường. Thiếu khoảng 200 con M20."],["B","Thanks for letting me know. Could you check crate 14? According to the packing list, they should be there.","Cảm ơn đã báo. Anh kiểm tra thùng 14 được không? Theo phiếu đóng gói, chúng nằm ở đó."],["A","Crate 14 hasn't been opened yet. Give me a minute.","Thùng 14 chưa mở. Chờ tôi một phút."],["A","You're right—they're here. Sorry about that.","Anh nói đúng—chúng ở đây. Xin lỗi nhé."],["B","No problem. For next time, we'll put a copy of the packing list inside each crate.","Không sao. Lần sau chúng tôi sẽ để bản sao phiếu đóng gói trong mỗi thùng."],["A","That would help a lot.","Như vậy sẽ giúp nhiều lắm."]]},{"id":"jp-1","g":"JP","t":"Họp với khách Nhật bằng tiếng Anh","s":"Giới thiệu năng lực cho nhà thầu Nhật.","a":"Tay","b":"Mr. Tanaka (Shimizu)","l":[["A","Thank you for visiting our factory, Mr. Tanaka. Let me start with a short presentation.","Cảm ơn ông Tanaka đã đến thăm nhà máy. Tôi xin bắt đầu bằng bài thuyết trình ngắn."],["B","Thank you. We are interested in your experience with JIS steel.","Cảm ơn. Chúng tôi quan tâm đến kinh nghiệm của bên anh với thép JIS."],["A","We have supplied about 5,000 tonnes to Japan over the past three years, mostly SN490B and STKR400.","Ba năm qua chúng tôi đã cung cấp khoảng 5.000 tấn sang Nhật, chủ yếu SN490B và STKR400."],["B","Do you have welders with JIS Z 3801 qualification?","Bên anh có thợ hàn chứng chỉ JIS Z 3801 không?"],["A","Yes, we have 35 qualified welders, and the certificates are in this folder.","Có, chúng tôi có 35 thợ hàn đủ chứng chỉ, chứng chỉ ở trong tập hồ sơ này."],["B","Very good. How do you control the documents, such as the inspection records?","Rất tốt. Bên anh quản lý hồ sơ như biên bản kiểm tra thế nào?"],["A","Every member has a QR code linked to its records. I can show you on the shop floor.","Mỗi cấu kiện có mã QR liên kết với hồ sơ. Tôi có thể chỉ ông dưới xưởng."]]},{"id":"jp-2","g":"JP","t":"Giải trình sai lỗi","s":"Khách Nhật phát hiện lỗi hàn, giải trình nguyên nhân.","a":"Mr. Sato (Client)","b":"Tay","l":[["A","We found undercut on several welds in the last shipment. Can you explain why?","Chúng tôi phát hiện cháy cạnh ở vài mối hàn chuyến hàng trước. Anh giải thích được không?"],["B","First, I apologize. We investigated and found that one welder used too high a current.","Trước hết, tôi xin lỗi. Chúng tôi đã điều tra và thấy một thợ hàn dùng dòng điện quá cao."],["A","What corrective action have you taken?","Bên anh đã có hành động khắc phục gì?"],["B","We retrained the welder, added a check of welding parameters at the start of each shift, and increased visual inspection to 100 percent.","Chúng tôi đào tạo lại thợ hàn, thêm bước kiểm tra thông số hàn đầu mỗi ca, và tăng kiểm tra bằng mắt lên 100%."],["A","And the members already shipped?","Còn các cấu kiện đã gửi?"],["B","We will send a team to repair them on site at our cost. The NCR and the repair procedure are attached to my email.","Chúng tôi sẽ cử đội sang sửa tại công trường bằng chi phí của chúng tôi. NCR và quy trình sửa được đính kèm email."],["A","Thank you for the quick response.","Cảm ơn phản hồi nhanh."]]},{"id":"jp-3","g":"JP","t":"Hỏi về yêu cầu tài liệu","s":"Khách Nhật yêu cầu hồ sơ chi tiết.","a":"Tay","b":"Ms. Yamada (Kume Sekkei)","l":[["A","Ms. Yamada, could you tell me which documents you need with each shipment?","Chị Yamada, chị cho tôi biết cần tài liệu nào cho mỗi chuyến hàng?"],["B","We need the mill certificates, the dimensional inspection records, the NDT reports and the paint inspection records.","Chúng tôi cần chứng chỉ xuất xưởng, biên bản kiểm tra kích thước, báo cáo NDT và biên bản kiểm tra sơn."],["A","Should the documents be in English or Japanese?","Tài liệu nên bằng tiếng Anh hay tiếng Nhật?"],["B","English is fine, but please add Japanese titles to each form.","Tiếng Anh được, nhưng vui lòng thêm tiêu đề tiếng Nhật cho mỗi biểu mẫu."],["A","No problem. I speak some Japanese, so I can prepare them.","Không vấn đề. Tôi nói được tiếng Nhật nên có thể chuẩn bị."],["B","That's very helpful. Please send a sample set for our review first.","Rất hữu ích. Vui lòng gửi trước một bộ mẫu để chúng tôi xem."]]},{"id":"jp-4","g":"JP","t":"Lắp thử dưới sự chứng kiến","s":"Khách chứng kiến lắp thử mái vòm.","a":"Mr. Suzuki (Taisei)","b":"Tay","l":[["A","The trial assembly looks good. What was the maximum gap at the splices?","Lắp thử trông tốt. Khe hở lớn nhất ở các mối nối là bao nhiêu?"],["B","The maximum gap was 1.5 millimeters, within the 2-millimeter tolerance.","Khe hở lớn nhất 1,5 mm, trong dung sai 2 mm."],["A","And the overall span?","Còn tổng nhịp?"],["B","We measured 48,003 millimeters against the design of 48,000. All readings are in this report.","Chúng tôi đo được 48.003 mm so với thiết kế 48.000. Mọi số đo nằm trong biên bản này."],["A","Excellent. I'll sign the release note. You can start packing.","Xuất sắc. Tôi sẽ ký phiếu cho xuất. Bên anh có thể đóng gói."],["B","Thank you. We'll mark each piece with its match marks before dismantling.","Cảm ơn ông. Chúng tôi sẽ đánh dấu khớp từng chi tiết trước khi tháo."]]},{"id":"nb-1","g":"NB","t":"Đặt chỗ tàu với forwarder","s":"Đặt chỗ container đi Brisbane.","a":"Tay","b":"Lisa (Forwarder)","l":[["A","Hi Lisa, I need to book six 40-foot containers from Hai Phong to Brisbane.","Chào Lisa, tôi cần đặt sáu container 40 feet từ Hải Phòng đi Brisbane."],["B","Sure. When will the cargo be ready?","Được. Khi nào hàng sẵn sàng?"],["A","On the 10th. Ideally, the vessel should leave before the 15th.","Ngày 10. Lý tưởng nhất là tàu rời trước ngày 15."],["B","There's a sailing on the 13th with an ETA of the 28th. The rate is 1,850 dollars per container.","Có chuyến ngày 13, dự kiến đến ngày 28. Giá 1.850 đô mỗi container."],["A","Does that include the local charges in Hai Phong?","Có gồm phí địa phương ở Hải Phòng không?"],["B","No, local charges are about 120 dollars per container.","Không, phí địa phương khoảng 120 đô mỗi container."],["A","Okay, please go ahead and send me the booking confirmation.","Được, vui lòng đặt và gửi tôi xác nhận đặt chỗ."]]},{"id":"nb-2","g":"NB","t":"Phỏng vấn tiếng Anh (vị trí PM)","s":"Trả lời câu hỏi phỏng vấn cho công ty nước ngoài.","a":"Interviewer","b":"Tay","l":[["A","Could you tell me about your experience?","Anh có thể nói về kinh nghiệm của mình không?"],["B","I have over ten years of experience in steel structures. I worked in Osaka for five years and have managed export projects to Japan, Australia and Canada.","Tôi có hơn mười năm kinh nghiệm kết cấu thép. Tôi làm việc ở Osaka năm năm và đã quản lý các dự án xuất khẩu sang Nhật, Úc và Canada."],["A","What was your biggest challenge?","Thử thách lớn nhất của anh là gì?"],["B","A project where the vessel was delayed by a typhoon. I reorganized the shipping plan and sent critical parts by air, so the client's erection started on time.","Một dự án mà tàu bị hoãn do bão. Tôi sắp xếp lại kế hoạch vận chuyển và gửi các chi tiết quan trọng bằng đường hàng không, nên khách hàng vẫn lắp dựng đúng hạn."],["A","Why do you want to join our company?","Vì sao anh muốn gia nhập công ty chúng tôi?"],["B","I want to move from fabrication to the main contractor side and manage whole projects, from design to handover.","Tôi muốn chuyển từ phía chế tạo sang phía tổng thầu và quản lý toàn bộ dự án, từ thiết kế đến bàn giao."],["A","Thank you. Do you have any questions for us?","Cảm ơn. Anh có câu hỏi nào cho chúng tôi không?"],["B","Yes. What does a typical week look like for a project manager here?","Có. Một tuần làm việc điển hình của giám đốc dự án ở đây như thế nào?"]]},{"id":"nb-3","g":"NB","t":"Thuyết trình ngắn trong họp","s":"Mở đầu và chuyển ý khi thuyết trình.","a":"Tay","b":"Audience","l":[["A","Good afternoon, everyone. Today I'd like to talk about our delivery performance this quarter.","Chào buổi chiều mọi người. Hôm nay tôi muốn nói về hiệu quả giao hàng quý này."],["A","I'll cover three points: on-time delivery, quality issues, and next steps.","Tôi sẽ trình bày ba điểm: giao đúng hạn, vấn đề chất lượng, và bước tiếp theo."],["A","Let's start with on-time delivery. As you can see on this chart, we delivered 92 percent of shipments on time.","Bắt đầu với giao đúng hạn. Như các bạn thấy trên biểu đồ, chúng ta giao đúng hạn 92% chuyến hàng."],["A","Moving on to quality, we received two NCRs, both related to painting.","Chuyển sang chất lượng, chúng ta nhận hai NCR, đều liên quan đến sơn."],["B","What caused the painting issues?","Nguyên nhân vấn đề sơn là gì?"],["A","Good question. High humidity during the rainy season. We've installed dehumidifiers in the paint shop.","Câu hỏi hay. Độ ẩm cao trong mùa mưa. Chúng ta đã lắp máy hút ẩm trong xưởng sơn."],["A","To sum up, performance is good, but we need better control of the painting environment. Thank you.","Tóm lại, hiệu quả tốt, nhưng cần kiểm soát môi trường sơn tốt hơn. Xin cảm ơn."]]},{"id":"nb-4","g":"NB","t":"Nhắc thanh toán qua điện thoại","s":"Nhắc khách hóa đơn quá hạn một cách lịch sự.","a":"Tay","b":"Anna (Accounts)","l":[["A","Hi Anna, this is Tay from Dai Dung. I'm calling about invoice 2290.","Chào Anna, tôi là Tây ở Đại Dũng. Tôi gọi về hóa đơn 2290."],["B","Let me check... Yes, I see it here.","Để tôi kiểm tra... Vâng, tôi thấy rồi."],["A","It was due on 1 October, and we haven't received the payment yet. Could you check the status?","Hạn thanh toán là 1/10 và chúng tôi chưa nhận được. Chị kiểm tra giúp tình trạng được không?"],["B","It seems it's waiting for approval because the delivery note was missing.","Có vẻ nó đang chờ duyệt vì thiếu phiếu giao hàng."],["A","I see. I'll email the signed delivery note right away.","Tôi hiểu. Tôi sẽ email phiếu giao hàng đã ký ngay."],["B","Thanks. Once I have it, the payment should go out in the next payment run, on Friday.","Cảm ơn. Khi có nó, khoản thanh toán sẽ được chuyển trong đợt chi tiếp theo, thứ Sáu."],["A","Great, I appreciate your help.","Tuyệt, cảm ơn chị đã giúp."]]}]/*DLEND*/;
const EM=/*EM*/[{"id":"em-1","t":"Gửi hồ sơ năng lực","s":"Sau cuộc gọi giới thiệu.","subj":"Subject: Dai Dung Group – Company profile and reference projects","en":"Dear Mark,\n\nThank you for your time on the phone this morning.\n\nAs promised, please find attached our company profile, a list of reference projects in Australia and our ISO 9001 and AS/NZS 1554.1 certificates.\n\nWe would be very interested in pricing the steel package for the Barlow Park stadium upgrade. Please let me know if you need any further information.\n\nBest regards,\nTay Nguyen\nProject Manager – Export Projects","vi":"Chào Mark,\n\nCảm ơn anh đã dành thời gian nói chuyện điện thoại sáng nay.\n\nNhư đã hứa, đính kèm là hồ sơ năng lực công ty, danh sách dự án tham chiếu tại Úc và chứng chỉ ISO 9001, AS/NZS 1554.1.\n\nChúng tôi rất mong được báo giá gói thép cho dự án nâng cấp sân vận động Barlow Park. Vui lòng cho tôi biết nếu anh cần thêm thông tin.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-2","t":"Gửi báo giá","s":"Gửi báo giá kèm giả định và loại trừ.","subj":"Subject: Quotation Q-2026-118 – Warehouse steel structure","en":"Dear Sarah,\n\nThank you for your inquiry. Please find attached our quotation Q-2026-118.\n\nSummary:\n- Total weight: approx. 480 tonnes (based on our takeoff from drawings Rev. B)\n- Price: USD 2,150 per tonne, FOB Hai Phong\n- Delivery: 10–12 weeks after approval of shop drawings\n- Validity: 30 days\n\nOur price is based on the assumptions and exclusions listed in Section 3. In particular, site erection and anchor bolt installation are excluded.\n\nPlease do not hesitate to contact me if you have any questions.\n\nKind regards,\nTay Nguyen","vi":"Chào Sarah,\n\nCảm ơn chị đã gửi yêu cầu. Đính kèm là báo giá Q-2026-118.\n\nTóm tắt:\n- Tổng trọng lượng: khoảng 480 tấn (theo bóc tách từ bản vẽ Rev. B)\n- Giá: 2.150 USD/tấn, FOB Hải Phòng\n- Giao hàng: 10–12 tuần sau khi duyệt bản vẽ gia công\n- Hiệu lực: 30 ngày\n\nGiá dựa trên các giả định và loại trừ ở Mục 3. Đặc biệt, lắp dựng tại công trường và lắp bu lông neo không bao gồm.\n\nĐừng ngần ngại liên hệ nếu chị có câu hỏi.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-3","t":"Gửi RFI","s":"Yêu cầu làm rõ thông tin bản vẽ.","subj":"Subject: RFI-007 – Rafter splice detail and bolt grade","en":"Dear David,\n\nWhile preparing the shop drawings, we found the following issues:\n\n1. The splice detail for rafter R1 at grid line 5 is not shown (drawing S-201).\n2. The bolt grade for the purlin cleats is not specified.\n\nCould you please provide the missing detail and confirm the bolt grade by Wednesday, 12 March? Until then, we will put these members on hold and continue with the columns.\n\nThank you for your support.\n\nBest regards,\nTay Nguyen","vi":"Chào David,\n\nKhi triển khai bản vẽ gia công, chúng tôi phát hiện các vấn đề sau:\n\n1. Chưa có chi tiết mối nối kèo R1 tại trục 5 (bản vẽ S-201).\n2. Chưa ghi cấp bền bu lông cho bản mã xà gồ.\n\nAnh vui lòng cung cấp chi tiết còn thiếu và xác nhận cấp bền bu lông trước thứ Tư, 12/3 được không? Đến lúc đó, chúng tôi sẽ tạm dừng các cấu kiện này và tiếp tục làm cột.\n\nCảm ơn sự hỗ trợ của anh.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-4","t":"Nộp bản vẽ để duyệt","s":"Phiếu chuyển giao bản vẽ gia công.","subj":"Subject: Submission of shop drawings – Package 1 (Columns)","en":"Dear David,\n\nPlease find attached 42 shop drawings for Package 1 (columns and base plates), Revision A, for your review and approval.\n\nThe transmittal and drawing list are also attached. We would appreciate your comments within 10 working days so that fabrication can start as planned on 1 April.\n\nBest regards,\nTay Nguyen","vi":"Chào David,\n\nĐính kèm là 42 bản vẽ gia công Gói 1 (cột và bản đế), Rev. A, để anh xem xét và phê duyệt.\n\nPhiếu chuyển giao và danh mục bản vẽ cũng được đính kèm. Chúng tôi rất mong nhận ý kiến trong 10 ngày làm việc để có thể bắt đầu chế tạo như kế hoạch vào 1/4.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-5","t":"Thông báo chậm trễ","s":"Báo trễ và đề xuất biện pháp.","subj":"Subject: Delay notice – Base plates (Order 4471)","en":"Dear Mark,\n\nI am writing to inform you that the delivery of the base plates will be delayed by approximately one week. The 40 mm plate from the mill arrived later than scheduled.\n\nTo minimize the impact on your erection program, we propose to:\n- ship all columns on the original date (15 April), and\n- send the base plates by air freight at our cost, arriving by 25 April.\n\nA revised delivery schedule is attached. We sincerely apologize for the inconvenience.\n\nBest regards,\nTay Nguyen","vi":"Chào Mark,\n\nTôi viết thư để thông báo việc giao bản đế sẽ chậm khoảng một tuần. Thép tấm 40 mm từ nhà máy về muộn hơn kế hoạch.\n\nĐể giảm thiểu ảnh hưởng đến tiến độ lắp dựng, chúng tôi đề xuất:\n- giao toàn bộ cột đúng ngày ban đầu (15/4), và\n- gửi bản đế bằng đường hàng không, chi phí do chúng tôi chịu, đến trước 25/4.\n\nTiến độ giao hàng điều chỉnh được đính kèm. Chúng tôi chân thành xin lỗi vì sự bất tiện.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-6","t":"Mời chứng kiến kiểm tra","s":"Mời khách dự điểm dừng trong ITP.","subj":"Subject: Invitation to witness – Trial assembly, Dome segment 1","en":"Dear Mr. Suzuki,\n\nIn accordance with the ITP (hold point 6.3), we would like to invite you to witness the trial assembly of Dome segment 1.\n\nDate: Tuesday, 18 March\nTime: 9:00 a.m. – 3:00 p.m.\nLocation: Workshop 2, Dai Dung factory, Binh Duong\n\nPlease confirm your attendance by 14 March. If you are unable to attend, we can arrange a live video inspection.\n\nBest regards,\nTay Nguyen","vi":"Kính gửi ông Suzuki,\n\nTheo ITP (điểm dừng 6.3), chúng tôi trân trọng mời ông chứng kiến lắp thử phân đoạn mái vòm 1.\n\nNgày: thứ Ba, 18/3\nGiờ: 9:00 – 15:00\nĐịa điểm: Xưởng 2, nhà máy Đại Dũng, Bình Dương\n\nVui lòng xác nhận tham dự trước 14/3. Nếu ông không thể tham dự, chúng tôi có thể sắp xếp kiểm tra trực tuyến qua video.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-7","t":"Trả lời khiếu nại chất lượng","s":"Phản hồi NCR của khách.","subj":"Subject: Re: NCR-012 – Undercut on welds (Shipment 2)","en":"Dear Mr. Sato,\n\nThank you for informing us about the undercut found on shipment 2. We take this matter very seriously.\n\nRoot cause: one welder used welding current above the WPS range.\nCorrective actions:\n1. The welder has been retrained and re-tested.\n2. Welding parameters are now checked at the start of every shift.\n3. Visual inspection has been increased to 100% until further notice.\n\nWe will send a repair team to the site at our cost. The repair procedure is attached for your approval.\n\nWe apologize for the trouble this has caused.\n\nSincerely,\nTay Nguyen","vi":"Kính gửi ông Sato,\n\nCảm ơn ông đã thông báo về lỗi cháy cạnh ở chuyến hàng 2. Chúng tôi rất nghiêm túc với vấn đề này.\n\nNguyên nhân gốc: một thợ hàn dùng dòng hàn vượt phạm vi WPS.\nHành động khắc phục:\n1. Thợ hàn đã được đào tạo và sát hạch lại.\n2. Thông số hàn được kiểm tra đầu mỗi ca.\n3. Kiểm tra bằng mắt tăng lên 100% cho đến khi có thông báo mới.\n\nChúng tôi sẽ cử đội sửa chữa đến công trường với chi phí của chúng tôi. Quy trình sửa chữa được đính kèm để ông phê duyệt.\n\nChúng tôi xin lỗi vì sự phiền phức đã gây ra.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-8","t":"Đề nghị phát sinh","s":"Gửi variation cho phần việc thêm.","subj":"Subject: Variation request VR-03 – Additional bracing, bays 4–6","en":"Dear Sarah,\n\nFurther to our call today, please find attached variation request VR-03 for the additional bracing in bays 4 to 6 (drawing S-305 Rev. C).\n\n- Additional weight: 6.1 tonnes\n- Rate: USD 2,150 per tonne (contract rate)\n- Total: USD 13,115\n- Delivery: with shipment 3 (sea freight)\n\nThe contract rate is valid if the approved drawings are received by Friday, 21 March. Please sign and return the variation at your earliest convenience.\n\nKind regards,\nTay Nguyen","vi":"Chào Sarah,\n\nTiếp theo cuộc gọi hôm nay, đính kèm là đề nghị phát sinh VR-03 cho giằng bổ sung ở nhịp 4–6 (bản vẽ S-305 Rev. C).\n\n- Khối lượng thêm: 6,1 tấn\n- Đơn giá: 2.150 USD/tấn (đơn giá hợp đồng)\n- Tổng: 13.115 USD\n- Giao hàng: cùng chuyến 3 (đường biển)\n\nĐơn giá hợp đồng có hiệu lực nếu nhận được bản vẽ duyệt trước thứ Sáu, 21/3. Vui lòng ký và gửi lại phát sinh sớm nhất có thể.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-9","t":"Thông báo giao hàng","s":"Gửi chứng từ sau khi tàu chạy.","subj":"Subject: Shipment 2 – Shipping documents (Vessel departed 13 May)","en":"Dear Ryan,\n\nWe are pleased to inform you that shipment 2 departed Hai Phong on 13 May.\n\nVessel: MAERSK EXAMPLE / Voyage 219S\nContainers: 6 x 40' (list attached)\nETA Vancouver: 9 June\n\nAttached are the bill of lading, commercial invoice, packing list and certificate of origin. The original documents will be sent by courier tomorrow.\n\nBest regards,\nTay Nguyen","vi":"Chào Ryan,\n\nChúng tôi vui mừng thông báo chuyến hàng 2 đã rời Hải Phòng ngày 13/5.\n\nTàu: MAERSK EXAMPLE / Chuyến 219S\nContainer: 6 x 40' (danh sách đính kèm)\nDự kiến đến Vancouver: 9/6\n\nĐính kèm là vận đơn, hóa đơn thương mại, phiếu đóng gói và giấy chứng nhận xuất xứ. Bản gốc sẽ gửi chuyển phát nhanh vào ngày mai.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-10","t":"Nhắc thanh toán","s":"Nhắc hóa đơn quá hạn lịch sự.","subj":"Subject: Friendly reminder – Invoice 2290 (due 1 October)","en":"Dear Anna,\n\nI hope you are well. This is a friendly reminder that invoice 2290 for USD 48,500, due on 1 October, remains outstanding.\n\nIf the payment has already been made, please disregard this message and kindly send us the remittance advice. Otherwise, we would appreciate it if you could arrange the payment by 15 October.\n\nPlease let me know if any documents are missing on your side.\n\nBest regards,\nTay Nguyen","vi":"Chào Anna,\n\nHy vọng chị vẫn khỏe. Đây là lời nhắc nhẹ rằng hóa đơn 2290 trị giá 48.500 USD, hạn ngày 1/10, vẫn chưa được thanh toán.\n\nNếu khoản thanh toán đã được thực hiện, vui lòng bỏ qua thư này và gửi giúp chúng tôi giấy báo chuyển tiền. Nếu chưa, chúng tôi rất cảm kích nếu chị có thể thu xếp thanh toán trước 15/10.\n\nVui lòng cho tôi biết nếu bên chị còn thiếu chứng từ nào.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-11","t":"Xin dời lịch họp","s":"Đổi giờ họp vì trùng lịch.","subj":"Subject: Request to reschedule – Weekly progress meeting","en":"Dear Emily,\n\nUnfortunately, I have a factory audit on Thursday morning and will not be able to join our weekly meeting at 9 a.m. Vancouver time.\n\nWould it be possible to move the meeting to Friday at the same time? Alternatively, I am available on Thursday after 4 p.m. Vancouver time.\n\nSorry for the inconvenience, and thank you for your understanding.\n\nBest regards,\nTay Nguyen","vi":"Chào Emily,\n\nRất tiếc, sáng thứ Năm tôi có buổi đánh giá nhà máy nên không thể tham dự cuộc họp tuần lúc 9 giờ sáng giờ Vancouver.\n\nCó thể dời cuộc họp sang thứ Sáu cùng giờ không? Hoặc tôi rảnh vào thứ Năm sau 4 giờ chiều giờ Vancouver.\n\nXin lỗi vì bất tiện và cảm ơn chị đã thông cảm.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-12","t":"Cảm ơn sau chuyến thăm","s":"Cảm ơn khách đã đến nhà máy.","subj":"Subject: Thank you for visiting our factory","en":"Dear Mr. Tanaka,\n\nThank you very much for visiting our factory yesterday. It was a pleasure to show you our welding and painting lines.\n\nAs requested, I have attached the welder qualification list and the sample inspection records with Japanese titles.\n\nWe look forward to the opportunity to work with Shimizu on the Osaka project.\n\nBest regards,\nTay Nguyen","vi":"Kính gửi ông Tanaka,\n\nXin chân thành cảm ơn ông đã đến thăm nhà máy hôm qua. Chúng tôi rất vui được giới thiệu dây chuyền hàn và sơn.\n\nTheo yêu cầu, tôi đính kèm danh sách chứng chỉ thợ hàn và bộ biên bản kiểm tra mẫu có tiêu đề tiếng Nhật.\n\nChúng tôi mong có cơ hội hợp tác với Shimizu trong dự án Osaka.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-13","t":"Thư xin việc ngắn","s":"Gửi CV cho vị trí PM tại tổng thầu.","subj":"Subject: Application for Project Manager position – Tay Nguyen","en":"Dear Hiring Manager,\n\nI am writing to apply for the Project Manager position advertised on your website.\n\nI have over ten years of experience in steel structures, including five years in Osaka and several export projects to Japan, Australia and Canada. In my current role at Dai Dung Group, I lead the technical side of projects from tender to erection.\n\nI hold JLPT N2 and am familiar with JIS, AS/NZS and CSA standards. I am confident that my experience on both the fabrication and client side would be valuable to your team.\n\nMy résumé is attached. I would welcome the opportunity to discuss my application.\n\nYours sincerely,\nTay Nguyen","vi":"Kính gửi Bộ phận Tuyển dụng,\n\nTôi viết thư này để ứng tuyển vị trí Giám đốc Dự án đăng trên website của quý công ty.\n\nTôi có hơn mười năm kinh nghiệm kết cấu thép, gồm năm năm ở Osaka và nhiều dự án xuất khẩu sang Nhật, Úc và Canada. Ở vị trí hiện tại tại tập đoàn Đại Dũng, tôi phụ trách kỹ thuật dự án từ đấu thầu đến lắp dựng.\n\nTôi có JLPT N2 và quen thuộc với các tiêu chuẩn JIS, AS/NZS và CSA. Tôi tin rằng kinh nghiệm ở cả phía chế tạo và phía khách hàng sẽ có giá trị với đội ngũ của quý công ty.\n\nCV được đính kèm. Tôi rất mong có cơ hội trao đổi thêm.\n\nTrân trọng,\nTây Nguyễn"},{"id":"em-14","t":"Từ chối lịch sự","s":"Từ chối yêu cầu ngoài phạm vi.","subj":"Subject: Re: Request for free site supervision","en":"Dear Mark,\n\nThank you for your email and for your confidence in our team.\n\nUnfortunately, site supervision is not included in our contract, and we are not able to provide it free of charge. However, we would be happy to offer a supervisor at a daily rate of USD 450, plus travel and accommodation.\n\nPlease let me know if you would like us to prepare a formal offer.\n\nBest regards,\nTay Nguyen","vi":"Chào Mark,\n\nCảm ơn email của anh và sự tin tưởng vào đội ngũ chúng tôi.\n\nRất tiếc, giám sát công trường không nằm trong hợp đồng và chúng tôi không thể cung cấp miễn phí. Tuy nhiên, chúng tôi sẵn lòng cử giám sát với đơn giá 450 USD/ngày, cộng chi phí đi lại và ăn ở.\n\nVui lòng cho tôi biết nếu anh muốn chúng tôi chuẩn bị chào giá chính thức.\n\nTrân trọng,\nTây Nguyễn"}]/*EMEND*/;
{
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='janenglish-v1';
let S={days:[],les:{},known:{},rev:{},dl:{},test:{},exam:'2027-01-19',rate:0.95};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)S=Object.assign(S,d)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mark=()=>{const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-400);save()}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1600)};
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';

/* ---------- speech ---------- */
let VO=[];const loadV=()=>{try{VO=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}catch(e){}};
if('speechSynthesis'in window){loadV();speechSynthesis.onvoiceschanged=loadV}
const pickV=(acc,alt)=>{const L={US:/en[-_]US/i,GB:/en[-_]GB/i,AU:/en[-_]AU/i,CA:/en[-_](CA|US)/i}[acc]||/en/i;let c=VO.filter(v=>L.test(v.lang));if(!c.length)c=VO;if(!c.length)return null;return c[(alt||0)%c.length]};
const speak=(t,acc,alt,onend)=>{if(!('speechSynthesis'in window)){toast('Trình duyệt không hỗ trợ đọc');onend&&onend();return}const u=new SpeechSynthesisUtterance(t);const v=pickV(acc||'US',alt);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=S.rate||0.95;if(onend){u.onend=onend;u.onerror=onend}speechSynthesis.speak(u)};
const stopV=()=>{try{speechSynthesis.cancel()}catch(e){}};
const playSeq=(items,onLine,done)=>{stopV();let i=0;let alive=true;const next=()=>{if(!alive)return;if(i>=items.length){onLine&&onLine(-1);done&&done();return}const it=items[i];onLine&&onLine(i);i++;speak(it.t,it.acc,it.alt,()=>setTimeout(next,it.gap||350))};next();return()=>{alive=false;stopV();onLine&&onLine(-1)}};
const rateCtl=()=>`<label>Tốc độ đọc <select id="rate">${[[0.75,'Chậm'],[0.95,'Vừa'],[1.1,'Nhanh']].map(([v,n])=>`<option value="${v}"${Math.abs(S.rate-v)<.01?' selected':''}>${n}</option>`).join('')}</select></label>`;
const bindRate=()=>{const r=$('#rate');if(r)r.onchange=()=>{S.rate=+r.value;save()}};

/* ---------- data helpers ---------- */
const DECK=50;
const TSLD=[];for(let i=0;i<TSL.length;i+=DECK)TSLD.push({id:'tsl-'+(TSLD.length+1),t:'TOEIC '+(TSLD.length+1),range:(i+1)+'–'+Math.min(i+DECK,TSL.length),w:TSL.slice(i,i+DECK).map(x=>({w:x[0],pos:x[1],ipa:x[2],vi:x[3]}))});
const TPD=TP.map(t=>({id:t.id,t:t.t,g:t.g,w:t.w.map(x=>({w:x[0],vi:x[1],ex:x[2],exv:x[3]}))}));
const ALLD=[...TSLD,...TPD];
const allWords=()=>ALLD.flatMap(d=>d.w.map(w=>Object.assign({d:d.id},w)));
const nKnown=()=>Object.keys(S.known).length;
const nWords=()=>new Set(allWords().map(x=>x.w)).size;
const streak=()=>{let n=0;const d=new Date();for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else if(n===0&&k===today()){d.setDate(d.getDate()-1)}else break}return n};
const daysLeft=()=>{if(!S.exam)return null;const t=new Date(S.exam+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)};

/* ---------- quiz engine ---------- */
function quiz(box,qs,opt){opt=opt||{};let i=0,ok=0;const res=[];
 const draw=()=>{if(i>=qs.length){const pct=Math.round(ok*100/qs.length);box.innerHTML=`<div class="panel"><div class="score">${ok}/${qs.length}</div><p class="muted">Đúng ${pct}%.</p><div class="row"><button class="btn" id="qa">Làm lại</button>${opt.more?'<button class="btn ghost" id="qm">Lượt mới</button>':''}${opt.after||''}</div></div>`;$('#qa').onclick=()=>{i=0;ok=0;res.length=0;qs=shuffle(qs);draw()};if(opt.more)$('#qm').onclick=opt.more;opt.done&&opt.done(ok,qs.length);return}
  const q=qs[i];const o=q.keep?q.o:shuffle(q.o);
  box.innerHTML=`<div class="qbar">${qs.map((_,k)=>`<i class="${k<i?(res[k]?'r':'w'):k===i?'c':''}"></i>`).join('')}</div>${q.pre||''}<div class="qtext">${esc(q.q)}</div><div class="opts">${o.map((x,k)=>`<button class="opt" data-k="${k}"><b>${'ABCD'[k]}</b>${esc(x)}</button>`).join('')}</div><div id="qw"></div>`;
  q.onShow&&q.onShow(box);
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const pick=o[+b.dataset.k],right=pick===q.a;res[i]=right;if(right)ok++;box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(o[+x.dataset.k]===q.a)x.classList.add('right')});if(!right)b.classList.add('wrong');
   $('#qw').innerHTML=`<div class="why"><b>${right?'Đúng.':'Chưa đúng.'}</b> ${esc(q.why||'')}${q.post||''}</div><div class="row" style="margin-top:12px"><button class="btn" id="qn">${i+1<qs.length?'Câu tiếp':'Xem kết quả'}</button></div>`;q.onAnswer&&q.onAnswer(box,right);$('#qn').onclick=()=>{stopV();i++;draw()};$('#qn').focus()})};
 draw()}

/* ---------- views ---------- */
function setNav(h){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h))}
function viewHome(){const dl=daysLeft(),kn=nKnown(),nw=nWords(),gd=GR.filter(g=>S.les[g.id]).length;
 const tslKnown=TSL.filter(x=>S.known[x[0]]).length;
 app.innerHTML=`<section class="hero band"><div class="wrap hgrid"><div><h1>Học tiếng Anh cho TOEIC và công việc kết cấu thép</h1><p class="lead">Từ vựng TOEIC có phiên âm, ngữ pháp Part 5–6, luyện nghe đọc theo Part, hội thoại và email mẫu với khách hàng Úc, Canada, Nhật.</p>
 <div class="stats"><div class="stat"><b>${kn}</b><span>từ đã nhớ / ${nw}</span></div><div class="stat"><b>${gd}/${GR.length}</b><span>bài ngữ pháp</span></div><div class="stat"><b>${streak()}</b><span>ngày học liên tiếp</span></div></div>
 <div class="row"><a class="btn" href="#${nextDeck()}">Học tiếp từ vựng</a><a class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.4)" href="#test">Luyện đề</a></div></div>
 <div class="hcard"><h3>Kỳ thi TOEIC</h3>${dl===null?'<p>Chưa đặt ngày thi.</p>':dl>=0?`<div class="cd">${dl}<small>ngày nữa</small></div>`:'<p>Ngày thi đã qua — đặt ngày mới bên dưới.</p>'}
 <label style="font-size:14px;color:#c6d1e4">Ngày thi <input type="date" id="exam" value="${esc(S.exam||'')}"></label>
 <div><div style="display:flex;justify-content:space-between;font-size:14px;color:#c6d1e4"><span>Từ vựng TOEIC (TSL)</span><span>${tslKnown}/${TSL.length}</span></div><div class="meter"><i style="width:${Math.round(tslKnown*100/TSL.length)}%"></i></div></div>
 ${dl>0?`<p style="margin:0;font-size:14px;color:#c6d1e4">Để học hết phần TSL còn lại trước ngày thi: khoảng <b style="color:#fff">${Math.ceil((TSL.length-tslKnown)/dl)}</b> từ mỗi ngày.</p>`:''}</div></div></section>
 <section class="band"><div class="wrap"><h2>Lộ trình</h2><p class="muted">Chọn một phần để bắt đầu. Tiến độ được lưu trên trình duyệt của thiết bị này.</p><div class="paths">
 ${[['#grammar','Gr','Ngữ pháp TOEIC',GR.length+' bài, mỗi bài 5 câu kiểu Part 5.'],['#vocab','Aa','Từ vựng',TSL.length+' từ TOEIC + '+TPD.reduce((s,d)=>s+d.w.length,0)+' từ chuyên ngành, văn phòng.'],['#test','L/R','Luyện đề theo Part','Part 2–4 có đọc âm thanh, Part 5–7 có giải thích.'],['#talk','Hi','Hội thoại công việc',DL.length+' tình huống với khách Úc, Canada, Nhật.'],['#mail','@','Email mẫu',EM.length+' email thường dùng, song ngữ.'],['#review','↻','Ôn tập','Từ bạn đánh dấu “chưa nhớ”.']].map(([h,g,t,p])=>`<a class="path" href="${h}"><div class="glyph">${g}</div><h3>${t}</h3><p>${p}</p><span class="go">Vào học →</span></a>`).join('')}</div></div></section>`;
 const ex=$('#exam');ex.onchange=()=>{S.exam=ex.value;save();viewHome()}}
function nextDeck(){const d=TSLD.find(d=>d.w.some(w=>!S.known[w.w]));return d?d.id:'vocab'}

let gCat='all';
function viewGrammar(){const cats=['all',...new Set(GR.map(g=>g.c))];
 app.innerHTML=`<section class="band"><div class="wrap"><h2>Ngữ pháp TOEIC</h2><p class="muted">${GR.length} chủ điểm thường gặp ở Part 5 và Part 6. Mỗi bài có công thức, ví dụ có âm thanh và 5 câu luyện.</p>
 <div class="chips">${cats.map(c=>`<button class="chip${gCat===c?' on':''}" data-c="${esc(c)}">${c==='all'?'Tất cả':esc(c)}</button>`).join('')}</div>
 <div class="list">${GR.filter(g=>gCat==='all'||g.c===gCat).map((g,k)=>`<a class="item" href="#${g.id}"><span class="badge">${GR.indexOf(g)+1}</span><div><h3>${esc(g.t)}</h3><div class="muted" style="font-size:14px">${esc(g.c)}</div>${S.les[g.id]?`<div class="done">✓ ${S.les[g.id]}/5</div>`:''}</div></a>`).join('')}</div></div></section>`;
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{gCat=b.dataset.c;viewGrammar()})}
function viewLesson(L){const k=GR.indexOf(L),nx=GR[k+1];
 app.innerHTML=`<section class="band"><div class="wrap"><a class="back" href="#grammar">← Ngữ pháp</a><span class="badge r">${esc(L.c)}</span><h2 style="margin-top:8px">${esc(L.t)}</h2><p class="muted" style="max-width:48em">${esc(L.s)}</p>

 const draw=()=>{if(!list.length){app.innerHTML=`<section class="band"><div class="wrap cardbox"><a class="back" href="${back}">← Quay lại</a><h2>${esc(title)}</h2><p class="muted">Không còn thẻ nào.</p></div></section>`;return}
  if(i>=list.length){const n=list.filter(w=>S.known[w.w]).length;app.innerHTML=`<section class="band"><div class="wrap cardbox"><a class="back" href="${back}">← Quay lại</a><h2>Xong lượt này</h2><p>${n}/${list.length} từ đã nhớ.</p><div class="row"><button class="btn" id="again">Học lại từ chưa nhớ</button><a class="btn ghost" href="${back}">Quay lại</a></div></div></section>`;$('#again').onclick=()=>{list=list.filter(w=>!S.known[w.w]);i=0;flip=false;draw()};return}
  const w=list[i];

  <button class="flash" id="card">${flip?`<div class="mean">${esc(w.vi)}</div><div class="big" style="font-size:28px">${esc(w.w)}</div>${w.ipa?`<div class="ipa">/${esc(w.ipa)}/</div>`:''}${w.ex?`<div class="exe">${esc(w.ex)}</div><div class="exv">${esc(w.exv)}</div>`:''}`:`<div class="big">${esc(w.w)}</div>${w.ipa?`<div class="ipa">/${esc(w.ipa)}/</div>`:''}${w.pos?`<div class="pos">${esc(w.pos)}</div>`:''}`}</button>

  $('#card').onclick=()=>{flip=!flip;draw()};$('#sp').onclick=()=>{stopV();speak(flip&&w.ex?w.ex:w.w)};

 draw()}

function viewMail(E){let vi=false;const draw=()=>{const k=EM.indexOf(E),nx=EM[k+1];
 app.innerHTML=`<section class="band"><div class="wrap"><a class="back" href="#mail">← Email mẫu</a><h2>${esc(E.t)}</h2><p class="muted">${esc(E.s)}</p>
 <div class="ctl"><button class="btn" id="cp">Sao chép email</button><button class="btn ghost" id="sw">${vi?'Xem tiếng Anh':'Xem tiếng Việt'}</button><button class="btn ghost" id="rd">${SPK.replace('<svg','<svg width="18" height="18"')} Nghe</button></div>
 <div class="mail">${vi?esc(E.vi):'<b>'+esc(E.subj)+'</b>\n\n'+esc(E.en)}</div>${nx?`<p style="margin-top:16px"><a class="btn ghost" href="#${nx.id}">Email tiếp: ${esc(nx.t)} →</a></p>`:''}</div></section>`;
 $('#sw').onclick=()=>{vi=!vi;draw()};$('#rd').onclick=()=>{stopV();speak(E.en)};
 $('#cp').onclick=()=>{const t=E.subj+'\n\n'+E.en;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã sao chép'),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Đã sao chép')}catch(e){}a.remove()})}};
 draw()}

/* ---------- router ---------- */
function route(){stopV();const h=(location.hash||'#home').slice(1);window.scrollTo(0,0);
 const L=GR.find(g=>g.id===h),D=ALLD.find(d=>d.id===h),T=DL.find(d=>d.id===h),E=EM.find(e=>e.id===h);
 let m;
 if(L){setNav('grammar');viewLesson(L)}
 else if(D){setNav('vocab');viewDeck(D)}
 else if(T){setNav('talk');viewTalk(T)}
 else if(E){setNav('mail');viewMail(E)}
 else if((m=h.match(/^(p3|p4)-(\d+)$/))&&P34[m[1]][+m[2]]){setNav('test');viewP34(m[1],+m[2])}
 else if((m=h.match(/^(p6|p7)-(\d+)$/))&&P67[m[1]][+m[2]]){setNav('test');viewP67(m[1],+m[2])}
 else if(h==='p2'){setNav('test');viewP2()}
 else if(h==='p5'){setNav('test');viewP5()}
 else if(['p3','p4','p6','p7'].includes(h)){setNav('test');viewPList(h)}
 else{const V={grammar:viewGrammar,vocab:viewVocab,test:viewTest,talk:viewTalkList,mail:viewMailList,review:viewReview}[h];setNav(V?h:'home');(V||viewHome)()}}
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
